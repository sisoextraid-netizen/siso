function SalesPerf({ c }) {
  const per = c.period;
  const map = new Map();
  c.salesUsers.forEach(u => map.set(u.id, { name: u.name, code: u.salesCode || '', proyek: 0, inv: 0, omzet: 0, bayar: 0 }));
  c.projects.forEach(p => {
    const key = p.salesId || 'none';
    if (!map.has(key)) map.set(key, { name: p.salesName || 'Tanpa Sales', code: p.salesCode || '', proyek: 0, inv: 0, omzet: 0, bayar: 0 });
    const r = map.get(key);
    r.proyek += 1;
    if (p.invoice && inPeriod(p.invoice.date, per)) { r.inv += 1; r.omzet += p.invoice.total; r.bayar += paidOf(p); }
  });
  const rows = Array.from(map.values()).sort((a, b) => b.omzet - a.omzet);
  if (!rows.length) return null;
  return h`<section className="card" id="sales-perf"><div className="card-head"><h3>Kinerja per Sales</h3><span className="muted">Invoice berdasarkan tanggal terbit · ${periodLabel(per)}</span></div>
    <div className="tablewrap"><table className="ptable rt-perf"><thead><tr><th>Sales</th><th className="r">Proyek</th><th className="r">Invoice</th><th className="r">Omzet kontrak</th><th className="r">Terbayar</th><th className="r">Piutang</th></tr></thead>
      <tbody>${rows.map(r => h`<tr key=${r.code + r.name}><td><b>${r.name}</b><span className="muted mono">${r.code}</span></td><td className="r" data-l="Proyek">${r.proyek}</td><td className="r" data-l="Invoice">${r.inv}</td><td className="r" data-l="Omzet kontrak">${rp(r.omzet)}</td><td className="r" data-l="Terbayar">${rp(r.bayar)}</td><td className="r" data-l="Piutang"><b>${rp(r.omzet - r.bayar)}</b></td></tr>`)}</tbody></table></div></section>`;
}

function PeriodBar({ c, extra }) {
  const years = periodYears(c.projects, c.cash);
  const p = c.period;
  const setYear = e => { const y = e.target.value; c.setPeriod({ year: y, month: y === 'all' ? 'all' : p.month }); };
  const setMonth = e => { const m = e.target.value; c.setPeriod({ year: p.year === 'all' && m !== 'all' ? String(years[0]) : p.year, month: m }); };
  const isAll = p.year === 'all';
  return h`<div className="periodbar card">
    <label>Tahun<select id="per-year" value=${p.year} onChange=${setYear}><option value="all">Semua tahun</option>${years.map(y => h`<option key=${y} value=${String(y)}>${y}</option>`)}</select></label>
    <label>Bulan<select id="per-month" value=${p.month} onChange=${setMonth}><option value="all">Semua bulan</option>${MONTHS.map((m, i) => h`<option key=${m} value=${String(i)}>${m}</option>`)}</select></label>
    <div className="per-now"><span>Periode ditampilkan</span><b id="per-label">${periodLabel(p)}</b></div>
    ${isAll && p.month === 'all' ? null : h`<button className="btn sm" id="per-reset" onClick=${() => c.setPeriod({ year: 'all', month: 'all' })}>Reset filter</button>`}
    ${extra || null}</div>`;
}

function VerifRow({ p, kind, c }) {
  const i = p.invoice, rq = kind === 'settle' ? i.settleRequest : null;
  const [acc, setAcc] = useState((rq && rq.account) || cashSources()[0]);
  const [ref, setRef] = useState((rq && rq.note) || '');
  const [why, setWhy] = useState('');
  const amount = kind === 'dp' ? i.dpNominal : i.remaining;
  const can = c.canMoney;
  const go = () => (kind === 'dp' ? c.A.verifyDP(p.id, { account: acc, ref }) : c.A.verifySettle(p.id, { account: acc, ref }));
  return h`<li className="row col">
    <div className="row-top"><div className="row-main"><b>${p.client.name}</b><span>${p.name} · ${i.no} · ${fmtDate(i.date)} · Sales ${p.salesName || '-'}</span></div><b className="amt">${rp(amount)}</b></div>
    <div className="figs"><div><span>Total kontrak</span><b>${rp(i.total)}</b></div><div><span>${kind === 'dp' ? 'DP ditagih' : 'Sisa pelunasan'}</span><b>${rp(amount)}</b></div></div>
    ${rq ? h`<div className="reqbox"><div><b>Diajukan oleh ${rq.by}</b><span>${fmtDT(rq.at)} · pembayaran diterima ${fmtDate(rq.paidDate)} · ke ${rq.account}</span>${rq.note ? h`<span>Catatan: ${rq.note}</span>` : null}</div>
        ${rq.proof ? h`<img src=${rq.proof} alt="Bukti transfer" onClick=${() => c.open({ type: 'photo', src: rq.proof, title: 'Bukti transfer' })} />` : h`<em className="muted">Tanpa bukti terlampir</em>`}</div>` : null}
    <div className="form-inline">
      <${Field} label="Rekening tujuan"><select id=${'acc-' + kind + p.id} value=${acc} onChange=${e => setAcc(e.target.value)}>${cashSources(acc).map(a => h`<option key=${a}>${a}</option>`)}</select><//>
      <${Field} label="Catatan / No. referensi transfer"><input id=${'ref-' + kind + p.id} value=${ref} onChange=${e => setRef(e.target.value)} placeholder="mis. TRF 0712" /><//>
      <button className="btn primary" disabled=${!can} title=${can ? '' : 'Hanya Admin Keuangan yang berhak memverifikasi uang masuk'} onClick=${go}><${Ico} n="check" /> ${kind === 'dp' ? 'Verifikasi & Terima DP' : 'Verifikasi Pelunasan'}</button></div>
    ${kind === 'settle' ? h`<div className="rejectrow">
      <${Field} label="Alasan jika pengajuan dikembalikan ke Sales"><input id=${'why-' + p.id} value=${why} onChange=${e => setWhy(e.target.value)} placeholder="mis. nominal transfer belum sesuai" /><//>
      <button className="btn" disabled=${!can || !why.trim()} onClick=${() => c.A.rejectSettle(p.id, why)}>Kembalikan ke Sales</button></div>` : null}</li>`;
}

function ProduksiView({ c }) {
  const [photo, setPhoto] = useState(null);
  const [kpick, setKsel] = useState(null);
  const active = c.projects.filter(p => p.spk && (p.status === 'in_production' || p.status === 'in_rework'));
  const finished = c.projects.filter(p => p.spk && p.stageIdx >= 8);
  const firstFull = STAGES.findIndex((s, i) => active.some(p => p.stageIdx === i));
  const ksel = kpick === null ? Math.max(0, firstFull) : kpick;
  const crew = c.role === 'kru_lapangan';
  const rejects = [];
  c.projects.forEach(p => p.logs.forEach(l => { if (l.qc === 'perbaikan') rejects.push({ p, l }); }));
  const card = p => {
    const cl = p.cl, last = p.logs[p.logs.length - 1];
    return h`<li key=${p.id} className="row col">
      <div className="row-top"><div className="row-main"><b>${p.name}</b><span className="mono">${p.spk.no} · ${cl.category.toUpperCase()} · deadline ${fmtDate(p.spk.deadline)}</span></div><${StatusBadge} status=${p.status} /></div>
      <${Stepper} idx=${p.stageIdx} rework=${p.status === 'in_rework'} />
      <div className="two tight"><div><h4 className="mini">Qty per ukuran (pcs)</h4><${SizeGrid} cl=${cl} /></div>
        <div><h4 className="mini">Instruksi teknis</h4><ul className="speclist">${specRows(cl).filter(r => r[1] !== '-').map(r => h`<li key=${r[0]}><b>${r[0]}</b> ${r[1]}</li>`)}</ul><${SpecThumbs} c=${c} cl=${cl} /></div></div>
      ${last ? h`<div className=${'lastlog' + (last.qc === 'perbaikan' ? ' bad' : '')}><img src=${last.photo} alt="Foto bukti" onClick=${() => setPhoto(last.photo)} /><div><b>${last.stageName}${last.qc === 'perbaikan' ? ' · REJECT' : ''}</b><span>${last.note}</span><small>${last.operator} · ${fmtDT(last.at)}</small></div></div>` : null}
      <div className="row-act">
        ${crew ? h`<button className="btn primary" onClick=${() => c.open({ type: 'progress', pid: p.id })}><${Ico} n="cam" /> Update Progres: ${STAGES[p.stageIdx]}</button>` : null}
        <button className="btn" onClick=${() => c.open({ type: 'doc', doc: 'spk', pid: p.id })}><${Ico} n="doc" s=${14} /> Lembar SPK</button></div></li>`;
  };
  return h`<div className="stack">
    <p className="muted">${crew ? 'Pekerjaan lapangan tanpa data harga. Setiap tahap wajib punya foto bukti dan catatan.' : 'Pantau 8 tahap produksi dan status perbaikan. Update tahap dilakukan Kru Lapangan.'}</p>
    ${!crew ? h`<section className="card"><div className="card-head"><h3>Kanban SPK 8 Tahap</h3><span className="muted">${active.length} SPK aktif</span></div>
      <div className="ktabs" role="tablist" aria-label="Tahap produksi">${STAGES.map((s, i) => h`<button key=${s} role="tab" aria-selected=${ksel === i} className=${ksel === i ? 'on' : ''} onClick=${() => setKsel(i)}>${i + 1}. ${s} <b>${active.filter(p => p.stageIdx === i).length}</b></button>`)}
        <button role="tab" aria-selected=${ksel === 8} className=${ksel === 8 ? 'on' : ''} onClick=${() => setKsel(8)}>Selesai <b>${finished.length}</b></button></div>
      <div className="kanban">${STAGES.map((s, i) => {
        const here = active.filter(p => p.stageIdx === i);
        return h`<div key=${s} className=${'kcol' + (i === 6 ? ' bad' : '') + (ksel === i ? ' sel' : '')}><div className="khead"><span>${i + 1}. ${s}</span><b>${here.length}</b></div>
          ${here.map(p => h`<button key=${p.id} className="kcard" onClick=${() => c.open({ type: 'doc', doc: 'spk', pid: p.id })}><b>${p.name}</b><small className="mono">${p.spk.no}</small></button>`)}
          ${here.length ? null : h`<p className="kempty">Tidak ada SPK pada tahap ini.</p>`}</div>`;
      })}<div className=${'kcol done' + (ksel === 8 ? ' sel' : '')}><div className="khead"><span>Selesai</span><b>${finished.length}</b></div>${finished.map(p => h`<div key=${p.id} className="kcard static"><b>${p.name}</b><small className="mono">${p.spk.no}</small></div>`)}${finished.length ? null : h`<p className="kempty">Belum ada SPK yang selesai.</p>`}</div></div></section>` : null}
    ${!crew ? h`<section className="card"><div className="card-head"><h3>Log Reject / Perbaikan</h3></div>
      ${rejects.length ? h`<ul className="rejects">${rejects.map(r => h`<li key=${r.l.id}><b>${r.p.name}</b><span>${r.l.note}</span><small>${r.l.operator} · ${fmtDT(r.l.at)}</small></li>`)}</ul>` : h`<${Empty}>Tidak ada catatan reject.<//>`}</section>` : null}
    ${crew ? h`<${Fragment}>${!active.length ? h`<${Empty}>Belum ada SPK aktif. SPK terbit setelah Sales menekan Customer ACC.<//>` : null}<ul className="rows">${active.map(card)}</ul>
      ${finished.length ? h`<p className="muted">${finished.length} SPK sudah selesai produksi.</p>` : null}<//>` : null}
    ${photo ? h`<${Modal} title="Foto bukti kerja" onClose=${() => setPhoto(null)}><img className="bigimg" src=${photo} alt="Foto bukti" /><//>` : null}</div>`;

/* ---------- Modals ---------- */
function InvoiceModal({ c, pid, onClose }) {
  const p = c.projects.find(x => x.id === pid);
  const [category, setCategory] = useState(p.category || 'konveksi');
  const [items, setItems] = useState([{ id: uid('i'), name: p.name, qty: 1, price: p.estimate || 0 }]);
  const [mode, setMode] = useState('50');
  const [custom, setCustom] = useState('');
  const total = invTotal(items);
  const dp = mode === '50' ? Math.round(total / 2) : mode === '100' ? total : Math.min(total, Number(custom) || 0);
  const remaining = Math.max(0, total - dp);
  const valid = items.length && items.every(i => i.name.trim() && Number(i.qty) > 0 && Number(i.price) >= 0) && total > 0 && dp > 0;
  const setItem = (id, k, v) => setItems(its => its.map(i => (i.id === id ? { ...i, [k]: v } : i)));
  const saved = p.invoice;
  if (saved) {
    return h`<${Modal} title="Invoice sudah diterbitkan" sub=${saved.no} onClose=${onClose} footer=${h`<button className="btn" onClick=${onClose}>Tutup</button>`}>
      <div className="okbox"><${Ico} n="check" s=${22} /><div><b>${p.name}</b><span>Total ${rp(saved.total)} · DP ${rp(saved.dpNominal)} · sisa ${rp(saved.remaining)}</span></div></div>
      <div className="row-act"><a className="btn wa" href=${waLink(p.client.wa, dpMessage(p))} target="_blank" rel="noopener noreferrer"><${Ico} n="wa" /> Kirim Tagihan DP via WhatsApp</a>
        <button className="btn" onClick=${() => { onClose(); c.open({ type: 'doc', doc: 'invoice', pid }); }}><${Ico} n="doc" s=${14} /> Lihat Dokumen Invoice</button></div><//>`;
  }
  return h`<${Modal} wide=${true} title="Buat Invoice" sub=${p.client.name + ' · ' + p.name} onClose=${onClose}
    footer=${h`<button className="btn" onClick=${onClose}>Batal</button><button className="btn primary" disabled=${!valid} onClick=${() => c.A.saveInvoice(pid, { category, items, dpNominal: dp })}>Simpan & Terbitkan Invoice</button>`}>
    <div className="seg" role="radiogroup" aria-label="Kategori">${['konveksi', 'percetakan'].map(k => h`<button key=${k} role="radio" aria-checked=${category === k} className=${category === k ? 'on' : ''} onClick=${() => setCategory(k)}>${k === 'konveksi' ? 'Konveksi' : 'Percetakan'}</button>`)}</div>
    <div className="scroll flat"><table className="tbl edit inv"><thead><tr><th>Nama item</th><th className="num">Qty</th><th className="num">Harga satuan (Rp)</th><th className="num">Subtotal</th><th></th></tr></thead>
      <tbody>${items.map(i => h`<tr key=${i.id}>
        <td data-l="Nama item"><input aria-label="Nama item" id=${'in-' + i.id} value=${i.name} onChange=${e => setItem(i.id, 'name', e.target.value)} placeholder="PDH, Lanyard, Pin" /></td>
        <td className="num" data-l="Qty"><input aria-label="Qty" id=${'iq-' + i.id} inputMode="numeric" value=${i.qty} onChange=${e => setItem(i.id, 'qty', e.target.value.replace(/\D/g, ''))} /></td>
        <td className="num" data-l="Harga satuan (Rp)"><input aria-label="Harga satuan" id=${'ip-' + i.id} inputMode="numeric" value=${i.price} onChange=${e => setItem(i.id, 'price', e.target.value.replace(/\D/g, ''))} /></td>
        <td className="num strong" data-l="Subtotal">${rp((Number(i.qty) || 0) * (Number(i.price) || 0))}</td>
        <td><button className="icon-btn" aria-label="Hapus baris" disabled=${items.length < 2} onClick=${() => setItems(its => its.filter(x => x.id !== i.id))}><${Ico} n="trash" s=${15} /></button></td></tr>`)}</tbody></table></div>
    <button className="btn sm" onClick=${() => setItems(its => [...its, { id: uid('i'), name: '', qty: 1, price: 0 }])}><${Ico} n="plus" s=${14} /> Tambah Item</button>
    <div className="dpbox"><div><h4 className="mini">Termin pembayaran DP</h4>
        <div className="seg" role="radiogroup" aria-label="Termin DP">${[['50', 'DP 50%'], ['100', '100% (Lunas)'], ['custom', 'Custom Nominal']].map(o => h`<button key=${o[0]} role="radio" aria-checked=${mode === o[0]} className=${mode === o[0] ? 'on' : ''} onClick=${() => setMode(o[0])}>${o[1]}</button>`)}</div>
        ${mode === 'custom' ? h`<${Field} label="Nominal DP (Rp)"><input id="dp-custom" inputMode="numeric" value=${custom} onChange=${e => setCustom(e.target.value.replace(/\D/g, ''))} /><//>` : null}</div>
      <div className="sumbox"><div><span>Grand Total</span><b>${rp(total)}</b></div><div><span>DP yang ditagih</span><b>${rp(dp)}</b></div><div className="strong"><span>Sisa pelunasan</span><b>${rp(remaining)}</b></div></div></div><//>`;
}

function ClModal({ c, pid, onClose }) {
  const p = c.projects.find(x => x.id === pid);
  const [cl, setCl] = useState(() => JSON.parse(JSON.stringify(p.cl)));
  const [paste, setPaste] = useState('');
  const [showPaste, setShowPaste] = useState(false);
  const [specErr, setSpecErr] = useState('');
  const images = cl.specImages || {};
  const setSpec = (k, v) => setCl(s => ({ ...s, spec: { ...s.spec, [k]: v } }));
  const setM = (id, k, v) => setCl(s => ({ ...s, members: s.members.map(m => (m.id === id ? { ...m, [k]: v } : m)) }));
  const addRow = () => setCl(s => ({ ...s, members: [...s.members, { id: uid('m'), name: '', position: '', size: 'L', variant: '' }] }));
  const addPasted = () => {
    let rows = paste.split(/\r?\n/).map(l => l.split(/\t|;|,/).map(x => x.trim())).filter(r => r.length && r[0] !== undefined && r.some(Boolean));
    rows = rows.map(r => (/^\d+$/.test(r[0]) && r.length > 2 ? r.slice(1) : r));
    if (rows.length && /^nama/i.test(rows[0][0])) rows = rows.slice(1);
    const mem = rows.filter(r => r[0]).map(r => ({ id: uid('m'), name: r[0], position: r[1] || '', size: normSize(r[2]), variant: r[3] || '' }));
    if (!mem.length) { setSpecErr('Tidak ada baris yang bisa dibaca. Format: Nama, Jabatan, Ukuran, Varian.'); return; }
    setSpecErr('');
    setCl(s => ({ ...s, members: [...s.members, ...mem] }));
    setPaste(''); setShowPaste(false);
    c.toast(mem.length + ' personil ditambahkan dari daftar tempelan.');
  };
  const onSpecFile = async (k, e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setSpecErr('');
    try {
      const r = await compressImage(f, 900, 0.75);
      setCl(s => ({ ...s, specImages: { ...(s.specImages || {}), [k]: r.url } }));
    } catch (x) { setSpecErr(x.message); }
  };
  const delSpecImg = k => setCl(s => { const m = { ...(s.specImages || {}) }; delete m[k]; return { ...s, specImages: m }; });
  const imgFields = SPEC_FIELDS.filter(f => SPEC_IMG_KEYS.includes(f[0]));
  return h`<${Modal} wide=${true} title="Form Confirmation Letter" sub=${p.client.name + ' · ' + p.name + ' · v' + cl.version} onClose=${onClose}
    footer=${h`<button className="btn" onClick=${onClose}>Batal</button><button className="btn" onClick=${() => { c.A.saveCL(pid, cl, false); onClose(); }}>Simpan Draf CL</button><button className="btn primary" onClick=${() => { c.A.saveCL(pid, cl, true); onClose(); }}>Kirim / Update ke Tim Desain</button>`}>
    <h4 className="mini">Kategori produk</h4>
    <div className="seg" role="radiogroup" aria-label="Kategori produk">${[['konveksi', 'KONVEKSI', 'Kemeja, kaos, jaket, rompi, jersey'], ['percetakan', 'PERCETAKAN', 'Lanyard, brosur, buku, box, banner']].map(o => h`<button key=${o[0]} role="radio" aria-checked=${cl.category === o[0]} className=${cl.category === o[0] ? 'on' : ''} title=${o[2]} onClick=${() => setCl(s => ({ ...s, category: o[0] }))}>${o[1]}</button>`)}</div>
    <h4 className="mini">Rincian personil & ukuran (${cl.members.length})</h4>
    <div className="scroll tall flat"><table className="tbl edit clm"><thead><tr><th>No</th><th>Nama personil</th><th>Jabatan</th><th>Ukuran</th><th>Keterangan varian</th><th></th></tr></thead>
      <tbody>${cl.members.map((m, n) => h`<tr key=${m.id}><td className="num" data-l="No">${n + 1}</td>
        <td data-l="Nama personil"><input aria-label="Nama personil" id=${'cn-' + m.id} value=${m.name} onChange=${e => setM(m.id, 'name', e.target.value)} /></td>
        <td data-l="Jabatan"><input aria-label="Jabatan" id=${'cj-' + m.id} value=${m.position} onChange=${e => setM(m.id, 'position', e.target.value)} /></td>
        <td data-l="Ukuran"><select aria-label="Ukuran" id=${'cs-' + m.id} value=${m.size} onChange=${e => setM(m.id, 'size', e.target.value)}>${SIZES.map(s => h`<option key=${s}>${s}</option>`)}</select></td>
        <td data-l="Keterangan varian"><input aria-label="Varian" id=${'cv-' + m.id} value=${m.variant} onChange=${e => setM(m.id, 'variant', e.target.value)} placeholder="Lengan panjang, V-neck" /></td>
        <td><button className="icon-btn" aria-label="Hapus baris" onClick=${() => setCl(s => ({ ...s, members: s.members.filter(x => x.id !== m.id) }))}><${Ico} n="trash" s=${15} /></button></td></tr>`)}</tbody></table>
      ${!cl.members.length ? h`<${Empty}>Belum ada personil. Tambah baris atau tempel daftar nama.<//>` : null}</div>
    <div className="row-act"><button className="btn sm" onClick=${addRow}><${Ico} n="plus" s=${14} /> Tambah Baris Personil</button>
      <button className=${'btn sm' + (showPaste ? ' on' : '')} aria-expanded=${showPaste} onClick=${() => setShowPaste(v => !v)}><${Ico} n="doc" s=${14} /> Tempel daftar dari Excel / chat</button></div>
    ${showPaste ? h`<div className="pastebox">
      <textarea id="cl-paste" rows="5" value=${paste} onChange=${e => setPaste(e.target.value)} placeholder="Satu orang per baris: Nama, Jabatan, Ukuran, Varian"></textarea>
      <div className="row-act"><button className="btn sm primary" disabled=${!paste.trim()} onClick=${addPasted}>Tambahkan ke tabel</button>
        <span className="muted">Kolom dipisah tab (salin dari Excel), koma, atau titik koma. Ukuran selain S/M/L/XL/XXL menjadi Custom.</span></div></div>` : null}
    <h4 className="mini">Spesifikasi sablon / bordir / cetak</h4>
    <p className="muted">Isi keterangan tiap posisi. Gambar artwork atau referensi bersifat opsional dan ikut tercetak di dokumen CL dan SPK.</p>
    <div className="specgrid">${imgFields.map(([k, label]) => h`<div key=${k} className="specitem">
      <${Field} label=${label}><input id=${'sp-' + k} value=${cl.spec[k] || ''} onChange=${e => setSpec(k, e.target.value)} placeholder="mis. logo 7 cm" /><//>
      ${images[k] ? h`<div className="specimg"><img src=${images[k]} alt=${'Gambar ' + label} /><button className="btn sm" aria-label=${'Hapus gambar ' + label} onClick=${() => delSpecImg(k)}><${Ico} n="trash" s=${14} /> Hapus gambar</button></div>` : null}
      <${Field} label=${images[k] ? 'Ganti gambar ' + label : 'Gambar ' + label + ' (opsional)'}><input id=${'si-' + k} type="file" accept="image/*" onChange=${e => onSpecFile(k, e)} /><//></div>`)}</div>
    ${specErr ? h`<p className="errline">${specErr}</p>` : null}
    <div className="form-grid">
      <${Field} label="Kerah"><input id="sp-kerah" value=${cl.spec.kerah || ''} onChange=${e => setSpec('kerah', e.target.value)} /><//>
      <${Field} label="Bahan / kain"><input id="sp-bahan" value=${cl.spec.bahan || ''} onChange=${e => setSpec('bahan', e.target.value)} placeholder="mis. Cotton combed 24s" /><//>
      <div className="span2"><${Field} label="Teknik, warna benang / tinta, jenis laminasi"><input id="sp-teknik" value=${cl.spec.teknik || ''} onChange=${e => setSpec('teknik', e.target.value)} placeholder="Plastisol, DTF, bordir komputer" /><//></div>
      <div className="span2"><${Field} label="Catatan teknis dari customer"><textarea id="cl-notes" rows="3" value=${cl.notes} onChange=${e => setCl(s => ({ ...s, notes: e.target.value }))}></textarea><//></div></div><//>`;
}

function MockupModal({ c, pid, onClose }) {
  const p = c.projects.find(x => x.id === pid);
  const [img, setImg] = useState(null);
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const onFile = async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setBusy(true); setErr('');
    try { setImg(await compressImage(f, 1600, 0.88)); } catch (x) { setErr(x.message); }
    setBusy(false);
  };

  const setAcc = (i, k, v) => upd({ accounts: d.accounts.map((a, n) => (n === i ? Object.assign({}, a, { [k]: v }, k === 'bank' ? { src: '' } : {}) : a)) });

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = brandSlug() + '_profil-brand.json';

        c.toast('Profil dimuat dari berkas. Periksa lalu tekan Simpan Profil.');

        <${Field} label="WhatsApp / kontak"><input id="br-wa" value=${d.wa} onChange=${e => upd({ wa: e.target.value })} maxLength="40" placeholder="0812-3456-7890" /><//>

        <div className="span2"><${Field} label="Logo" hint="PNG, JPG, atau SVG. Disarankan latar transparan. Otomatis diperkecil.">
          <div className="logobox">

            <button className="btn sm" id="br-logo-btn" type="button" onClick=${() => fileRef.current && fileRef.current.click()}>${d.logo ? 'Ganti logo' : 'Unggah logo'}</button>

        <${Field} label="Bank / e-wallet"><input id=${'br-bank-' + i} value=${a.bank} onChange=${e => setAcc(i, 'bank', e.target.value)} placeholder="Bank BCA" /><//>
        <${Field} label="Nomor rekening"><input id=${'br-no-' + i} value=${a.no} onChange=${e => setAcc(i, 'no', e.target.value)} placeholder="1234567890" /><//>

        : h`<p className="muted">Belum ada rekening. Invoice akan menampilkan tanda "-".</p>`}
      <p className="muted" id="br-sources">Pilihan sumber dana di Buku Kas: <b>${srcPreview.join(', ')}</b>. Transaksi yang sudah tercatat tetap memakai nama saat dicatat.</p>
    </section>
    <section className="card"><div className="card-head"><h3>Pratinjau Kop Dokumen</h3></div>
      <div className="kopprev" id="br-preview"><div className="paper">${renderBlock({ t: 'head', kop: prevKop, title: 'INVOICE', number: 'INV-000000-001', date: fmtDate(new Date().toISOString()), badge: { text: 'CONTOH', tone: 'neutral' } })}</div></div></section>
    <div className="row-act">

function AuthScreen({ cfg, client, clientError, onDemo, onConfig }) {
  const [tab, setTab] = useState('login');
  const [f, setF] = useState({ name: '', email: '', pw: '', pw2: '' });
  const [err, setErr] = useState('');
  const [info, setInfo] = useState('');
  const [busy, setBusy] = useState(false);
  const [showCfg, setShowCfg] = useState(false);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const connected = !!client;
  const host = cfg ? cfg.url.replace(/^https?:\/\//, '').replace(/\/$/, '') : '';

  const submit = async e => {
    e.preventDefault();
    if (busy || !connected) return;
    setErr(''); setInfo('');
    const email = f.email.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { setErr('Format email belum benar.'); return; }
    if (tab === 'signup') {
      if (!f.name.trim()) { setErr('Nama lengkap wajib diisi.'); return; }
      if (f.pw.length < 8) { setErr('Password minimal 8 karakter.'); return; }
      if (f.pw !== f.pw2) { setErr('Konfirmasi password tidak sama.'); return; }
    } else if (tab === 'login' && !f.pw) { setErr('Password wajib diisi.'); return; }
    setBusy(true);
    try {
      if (tab === 'login') {
        const r = await client.auth.signInWithPassword({ email, password: f.pw });
        if (r.error) throw r.error;
      } else if (tab === 'signup') {
        const r = await client.auth.signUp({ email, password: f.pw, options: { data: { name: f.name.trim() } } });
        if (r.error) throw r.error;
        if (!r.data || !r.data.session) { setInfo('Pendaftaran berhasil. Kami mengirim email konfirmasi ke ' + email + '. Klik tautannya, lalu masuk di sini.'); setTab('login'); setF({ name: '', email, pw: '', pw2: '' }); }
      } else {
        const r = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
        if (r.error) throw r.error;
        setInfo('Tautan atur ulang password dikirim ke ' + email + '. Cek email Anda.');
      }
    } catch (x) { setErr(authMsg(x)); }
    setBusy(false);
  };
  const titles = { login: 'Masuk', signup: 'Daftar akun baru', forgot: 'Lupa password' };

  const gear = h`<button className="gearbtn" id="cfg-toggle" aria-haspopup="dialog" onClick=${() => setShowCfg(true)}><${Ico} n="gear" s=${14} /> Koneksi ${connected ? '· terhubung ke ' + host : '· belum terhubung'}</button>`;
  return h`<${AuthShell} foot=${gear}>
    <div className="authtabs" role="tablist">${[['login', 'Masuk'], ['signup', 'Daftar']].map(t => h`<button key=${t[0]} role="tab" id=${'tab-' + t[0]} aria-selected=${tab === t[0]} className=${tab === t[0] ? 'on' : ''} onClick=${() => { setTab(t[0]); setErr(''); setInfo(''); }}>${t[1]}</button>`)}</div>
    <h1 className="auth-title">${titles[tab]}</h1>
    ${!connected ? h`<div className="callout warnbox" id="auth-nocfg"><${Ico} n="alert" /> <span>${clientError || 'Supabase belum terhubung. Buka pengaturan Koneksi (ikon gear di pojok bawah) untuk mengisi URL dan key proyek Supabase, atau coba Mode Demo.'}</span></div>` : null}
    ${tab === 'signup' ? h`<p className="muted">Akun baru menunggu persetujuan Owner sebelum bisa membuka data. Orang pertama yang mendaftar otomatis menjadi Owner.</p>` : null}
    <form onSubmit=${submit} className="authform" noValidate>
      ${tab === 'signup' ? h`<${Field} label="Nama lengkap"><input id="au-name" autoComplete="name" value=${f.name} onChange=${set('name')} /><//>` : null}
      <${Field} label="Email"><input id="au-email" type="email" autoComplete="email" value=${f.email} onChange=${set('email')} placeholder="nama@email.com" /><//>
      ${tab !== 'forgot' ? h`<${Field} label="Password" hint=${tab === 'signup' ? 'Minimal 8 karakter' : null}><input id="au-pw" type="password" autoComplete=${tab === 'signup' ? 'new-password' : 'current-password'} value=${f.pw} onChange=${set('pw')} /><//>` : null}
      ${tab === 'signup' ? h`<${Field} label="Ulangi password"><input id="au-pw2" type="password" autoComplete="new-password" value=${f.pw2} onChange=${set('pw2')} /><//>` : null}
      ${err ? h`<p className="errline" id="au-err" role="alert">${err}</p>` : null}
      ${info ? h`<p className="infoline" id="au-info" role="status">${info}</p>` : null}
      <button className="btn primary wide" id="au-submit" disabled=${busy || !connected}>${busy ? 'Memproses...' : tab === 'login' ? 'Masuk' : tab === 'signup' ? 'Daftar' : 'Kirim tautan atur ulang'}</button>
    </form>
    <div className="authlinks">
      ${tab === 'login' ? h`<button className="linkbtn" id="au-forgot" onClick=${() => { setTab('forgot'); setErr(''); setInfo(''); }}>Lupa password?</button>` : null}
      ${tab === 'forgot' ? h`<button className="linkbtn" onClick=${() => { setTab('login'); setErr(''); setInfo(''); }}>Kembali ke halaman masuk</button>` : null}
    </div>
    <div className="authsep"><span>atau</span></div>
    <button className="btn wide" id="au-demo" onClick=${onDemo}>Coba Mode Demo (tanpa login, data hanya di browser ini)</button>
    ${showCfg ? h`<${DevModal} cfg=${cfg} client=${client} onConfig=${onConfig} onClose=${() => setShowCfg(false)} />` : null}<//>`;
}

function CenterNote({ title, children }) {
  return h`<${AuthShell}><h1 className="auth-title">${title}</h1>${children}<//>`;
}

function CloudGate({ cfg, onDemo, onConfig }) {
  const made = useMemo(() => { try { return { client: makeClient(cfg) }; } catch (e) { return { error: e.message }; } }, [cfg.url, cfg.anonKey]);
  const client = made.client;
  const [phase, setPhase] = useState('boot');
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [perr, setPerr] = useState('');
  const [pw, setPw] = useState('');
  const [rerr, setRerr] = useState('');
  const uidRef = useRef(null);
  const sid = session && session.user ? session.user.id : '';

  useEffect(() => {
    if (!client) { setPhase('out'); return undefined; }
    let alive = true;
    client.auth.getSession().then(r => {
      if (!alive) return;
      const s = r && r.data ? r.data.session : null;
      if (uidRef.current === null && s) { uidRef.current = s.user.id; setSession(s); }
      setPhase(p => (p === 'boot' ? (s ? 'profile' : 'out') : p));
    }).catch(() => { if (alive) setPhase(p => (p === 'boot' ? 'out' : p)); });
    const sub = client.auth.onAuthStateChange((ev, s) => {
      if (!alive) return;
      if (ev === 'PASSWORD_RECOVERY') { uidRef.current = s && s.user ? s.user.id : null; setSession(s); setPhase('recovery'); return; }
      if (ev === 'SIGNED_OUT' || !s || !s.user) { uidRef.current = null; setSession(null); setProfile(null); setPhase(p => (p === 'boot' && ev === 'INITIAL_SESSION' ? 'out' : 'out')); return; }
      if (s.user.id !== uidRef.current) { uidRef.current = s.user.id; setSession(s); setPhase('profile'); }
    });
    return () => { alive = false; try { sub.data.subscription.unsubscribe(); } catch (e) { /* abaikan */ } };
  }, [client]);

  useEffect(() => {
    if (!client || !sid || phase !== 'profile') return undefined;
    let alive = true;
    setPerr('');
    client.from('profiles').select('*').eq('id', sid).maybeSingle().then(r => {
      if (!alive) return;
      if (r.error) { setPerr(authMsg(r.error)); setPhase('error'); return; }
      if (!r.data) { setPerr('Profil pengguna tidak ditemukan. Pastikan berkas schema.sql sudah dijalankan di Supabase (ada trigger pembuat profil).'); setPhase('error'); return; }
      const u = rowToUser(r.data);
      setProfile(u);
      setPhase(u.role === 'pending' ? 'pending' : (!u.active ? 'inactive' : 'ready'));
    }).catch(x => { if (alive) { setPerr(authMsg(x)); setPhase('error'); } });
    return () => { alive = false; };
  }, [client, sid, phase]);

  const signOut = async () => { try { await client.auth.signOut(); } catch (e) { /* abaikan */ } uidRef.current = null; setSession(null); setProfile(null); setPhase('out'); };
  const setNewPw = async e => {
    e.preventDefault();
    if (pw.length < 8) { setRerr('Password minimal 8 karakter.'); return; }
    const r = await client.auth.updateUser({ password: pw });
    if (r.error) { setRerr(authMsg(r.error)); return; }
    setPw(''); setRerr(''); setPhase('profile');
  };

  if (phase === 'boot' || phase === 'profile') return h`<div className="splash" id="splash">Memuat akun...</div>`;
  if (phase === 'out') return h`<${AuthScreen} cfg=${cfg} client=${client} clientError=${made.error} onDemo=${onDemo} onConfig=${onConfig} />`;
  if (phase === 'recovery') return h`<${CenterNote} title="Atur password baru"><form className="authform" onSubmit=${setNewPw}>
      <${Field} label="Password baru" hint="Minimal 8 karakter"><input id="rc-pw" type="password" autoComplete="new-password" value=${pw} onChange=${e => setPw(e.target.value)} /><//>
      ${rerr ? h`<p className="errline">${rerr}</p>` : null}<button className="btn primary wide" id="rc-save">Simpan password</button></form><//>`;
  if (phase === 'pending' || phase === 'inactive') return h`<${CenterNote} title=${phase === 'pending' ? 'Menunggu persetujuan Owner' : 'Akun dinonaktifkan'}>
      <p id="gate-msg">${phase === 'pending' ? 'Akun ' + (profile ? profile.email : '') + ' sudah terdaftar. Owner perlu menetapkan peran Anda (Sales, Keuangan, dan seterusnya) sebelum Anda bisa membuka data.' : 'Akun ini dinonaktifkan oleh Owner. Hubungi Owner bila ini keliru.'}</p>
      <div className="row-act"><button className="btn primary" id="gate-recheck" onClick=${() => setPhase('profile')}>Periksa status</button><button className="btn" id="gate-logout" onClick=${signOut}>Keluar</button></div><//>`;
  if (phase === 'error') return h`<${CenterNote} title="Tidak bisa membuka akun"><p className="errline" id="gate-err">${perr}</p>
      <div className="row-act"><button className="btn primary" onClick=${() => setPhase('profile')}>Coba lagi</button><button className="btn" onClick=${signOut}>Keluar</button></div><//>`;
  return h`<${App} key=${profile.id} boot=${{ mode: 'cloud', user: profile, client, onExit: signOut }} />`;
}

function Root() {
  const [cfg, setCfg] = useState(readConfig);
  const [mode, setMode] = useState(() => lsGet(MODE_KEY) || '');
  const enterDemo = () => { lsSet(MODE_KEY, 'demo'); setMode('demo'); };
  const leaveDemo = () => { lsSet(MODE_KEY, null); setMode(''); };
  const changeCfg = c => {
    if (c) { lsSet(CFG_KEY, JSON.stringify(c)); setCfg({ url: c.url, anonKey: c.anonKey, fixed: false }); }
    else { lsSet(CFG_KEY, null); setCfg(readConfig()); }
  };
  if (mode === 'demo') return h`<${App} boot=${{ mode: 'demo', onExit: leaveDemo }} />`;
  if (cfg) return h`<${CloudGate} cfg=${cfg} onDemo=${enterDemo} onConfig=${changeCfg} />`;
  return h`<${AuthScreen} cfg=${null} client=${null} onDemo=${enterDemo} onConfig=${changeCfg} />`;
}

function UsersView({ c }) {
  const cloud = c.mode === 'cloud';
  const [busy, setBusy] = useState('');
  const pend = c.users.filter(u => u.role === 'pending');
  const rest = c.users.filter(u => u.role !== 'pending');
  const countOf = u => c.projects.filter(p => p.salesId === u.id).length;
  const roleOptions = ['pending'].concat(Object.keys(ROLES));
  const change = async (u, patch) => { setBusy(u.id); await c.A.updateUser(u.id, patch); setBusy(''); };

      <td><b>${u.name}</b>${me ? h`<em className="you">Anda</em>` : null}<span className="muted">${u.email}</span></td>
      <td><select id=${'role-' + u.id} aria-label=${'Peran ' + u.name} value=${u.role} disabled=${lock} onChange=${e => change(u, { role: e.target.value })}>${roleOptions.map(r => h`<option key=${r} value=${r}>${r === 'pending' ? 'Menunggu persetujuan' : ROLES[r].label}</option>`)}</select></td>

  };
  return h`<div className="stack">
    <p className="muted">${cloud ? 'Pengguna mendaftar sendiri lewat halaman Daftar, lalu muncul di sini sebagai "Menunggu persetujuan". Tetapkan perannya. Setiap akun Sales otomatis mendapat kode sendiri (S-01, S-02, dan seterusnya) yang tertera di nomor proyek, invoice, dan SPK.' : 'Mode Demo menampilkan pengguna contoh. Di Mode Supabase, Owner menyetujui akun dan menetapkan peran di halaman ini.'}</p>
    ${pend.length ? h`<div className="alertbox" role="alert" id="users-pending"><div className="alert-head"><${Ico} n="alert" /> <b>${pend.length} akun menunggu persetujuan</b></div></div>` : null}
    <section className="card"><div className="card-head"><h3>Daftar Pengguna</h3>
        ${cloud ? h`<button className="btn sm" id="users-reload" onClick=${() => c.A.reloadUsers()}>Muat ulang</button>` : null}</div>
      <div className="tablewrap"><table className="ptable rt-users" id="users-table"><thead><tr><th>Nama / Email</th><th>Peran</th><th>Kode Sales</th><th className="r">Proyek</th><th>Status</th></tr></thead>
        <tbody>${pend.concat(rest).map(row)}</tbody></table></div></section></div>`;
}

/* ---------- Kerangka aplikasi ---------- */
function App({ boot }) {
  useBrand();
  const cloud = boot.mode === 'cloud';
  const init = useMemo(() => (cloud ? { projects: [], cash: [], view: 'dashboard' } : (loadStore() || seed())), []);
  const [projects, setProjects] = useState(init.projects);
  const [cash, setCash] = useState(init.cash);
  const [users, setUsers] = useState(cloud ? [boot.user] : DEMO_USERS);
  const [userId, setUserId] = useState(cloud ? boot.user.id : (DEMO_USERS.some(u => u.id === init.userId) ? init.userId : 'u-owner'));
  const [view, setView] = useState(init.view || 'dashboard');
  const [confirmReset, setConfirmReset] = useState(false);
  const [period, setPeriod] = useState({ year: 'all', month: 'all' });
  const [phase, setPhase] = useState(cloud ? 'loading' : 'ready');
  const [loadErr, setLoadErr] = useState('');
  const [sync, setSync] = useState({ state: 'idle', msg: '' });
  const warned = useRef(false);
  const storeRef = useRef(null);
  const latest = useRef({ projects, cash });
  latest.current = { projects, cash };
  const [modal, setModal] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [drawer, setDrawer] = useState(false);

  const user = cloud ? boot.user : (DEMO_USERS.find(u => u.id === userId) || DEMO_USERS[0]);
  const role = user.role;
  const toast = (text, tone) => {
    const id = uid('t');
    setToasts(t => [...t.slice(-2), { id, text, tone: tone || 'ok' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4200);
  };

  /* Mode Demo: simpan di browser */
  const demoSnap = useRef(null);
  demoSnap.current = { projects, cash, userId, view };
  useEffect(() => {
    if (cloud) return;
    /* jaring pengaman: simpan juga saat tab ditutup / dimuat ulang sebelum efek sempat berjalan */
    const flush = () => { if (demoSnap.current) saveStore(demoSnap.current); };
    window.addEventListener('pagehide', flush); window.addEventListener('beforeunload', flush);
    return () => { window.removeEventListener('pagehide', flush); window.removeEventListener('beforeunload', flush); };
  }, [cloud]);
  useEffect(() => {
    if (cloud) return;
    const ok = saveStore({ projects, cash, userId, view });
    if (!ok && !warned.current) { warned.current = true; toast('Penyimpanan di browser penuh atau tidak tersedia. Data hanya bertahan selama halaman terbuka.', 'warn'); }
  }, [projects, cash, userId, view]);

  /* Mode Supabase: muat data awal lalu dengarkan perubahan */
  const loadCloud = () => {
    setPhase('loading'); setLoadErr('');
    const st = createCloudStore(boot.client, boot.user, {
      projects: fn => setProjects(fn), cash: fn => setCash(fn), status: setSync, toast, latest: () => latest.current
    });
    storeRef.current = st;
    st.load().then(async d => {
      setProjects(d.projects); setCash(d.cash);
      if (boot.user.role === 'owner') { try { setUsers(await fetchUsers(boot.client)); } catch (e) { /* daftar pengguna opsional */ } }
      setPhase('ready'); setSync({ state: 'ok', msg: '' });
      st.subscribe();
    }).catch(e => { setLoadErr(authMsg(e)); setPhase('error'); });
    return st;
  };
  useEffect(() => {
    if (!cloud) return undefined;
    const st = loadCloud();
    const warn = e => { if (st.pendingCount() > 0) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', warn);
    return () => { window.removeEventListener('beforeunload', warn); st.stop(); };
  }, []);
  useEffect(() => { if (cloud && phase === 'ready' && storeRef.current) storeRef.current.push(); }, [projects, cash, phase]);

  const canMoney = role === 'admin_keuangan' || role === 'owner';
  const canSales = role === 'sales' || role === 'owner';
  const salesUsers = users.filter(u => u.role === 'sales' && u.active);
  const visible = useMemo(() => (role === 'sales' ? projects.filter(p => p.salesId === user.id) : projects), [projects, role, user.id]);

  const go = v => { setView(v); try { window.location.hash = v; } catch (e) { /* abaikan */ } };
  useEffect(() => {
    try {
      const hv = (window.location.hash || '').replace('#', '');
      if (hv && ROLES.owner.menu.includes(hv)) setView(hv);
    } catch (e) { /* abaikan */ }
  }, []);
  const switchUser = id => {
    const u = DEMO_USERS.find(x => x.id === id);
    if (!u) return;
    setUserId(id); setModal(null);
    if (!ROLES[u.role].menu.includes(view)) go(ROLES[u.role].menu[0]);
  };
  const doReset = () => {
    if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 4000); return; }
    setConfirmReset(false); clearStore();
    const s = seed(); setProjects(s.projects); setCash(s.cash); setModal(null);
    toast('Data demo dikembalikan ke kondisi awal.');
  };
  const upd = (id, fn) => setProjects(ps => ps.map(p => (p.id === id ? fn(p) : p)));
  const maxSuffix = (list, key, code) => list.filter(p => p[key] && p.salesCode === code).reduce((m, p) => Math.max(m, parseInt((p[key].no || '').split('-').pop(), 10) || 0), 0);
  const tagOf = p => codeTag(p.salesCode) || 'S00';

  const A = {
    addProspect: d => {
      const su = role === 'sales' ? user : salesUsers.find(u => u.id === d.salesId);
      if (!su) { toast('Pilih Sales penanggung jawab terlebih dulu.', 'bad'); return; }
      const tag = codeTag(su.salesCode) || 'S00';
      const n = projects.filter(p => p.salesCode === su.salesCode).reduce((m, p) => Math.max(m, parseInt(p.code.split('-').pop(), 10) || 0), 0) + 1;
      const p = { id: uid('p'), code: ym() + '-' + tag + '-' + pad(n), name: d.name.trim(), category: 'konveksi',
        salesId: su.id, salesName: su.name, salesCode: su.salesCode,
        client: { name: d.client.trim(), wa: d.wa.trim(), address: d.address.trim() }, estimate: Number(d.estimate) || 0,
        status: 'prospect_follow_up', createdAt: new Date().toISOString(), invoice: null, designStatus: 'none', cl: null, mockups: [], spk: null, stageIdx: 0, logs: [] };
      setProjects(ps => [p, ...ps]); toast('Prospek ' + p.client.name + ' ditambahkan' + (role === 'sales' ? '.' : ' untuk ' + su.name + '.'));
    },
    setStatus: (id, st) => upd(id, p => ({ ...p, status: st })),
    saveInvoice: (id, d) => {
      const pr = projects.find(x => x.id === id);
      const no = 'INV-' + ym() + '-' + tagOf(pr) + '-' + pad(maxSuffix(projects, 'invoice', pr.salesCode) + 1);
      const total = invTotal(d.items), remaining = Math.max(0, total - d.dpNominal);
      const invoice = { no, date: new Date().toISOString(), category: d.category, items: d.items.map(i => ({ ...i, qty: Number(i.qty), price: Number(i.price) })), total, dpNominal: d.dpNominal, remaining,
        dpStatus: 'unverified', dpVerifiedAt: null, dpAccount: '', dpRef: '', settleStatus: remaining === 0 ? 'na' : 'none', settleVerifiedAt: null, settleAccount: '', settleRef: '', settleRequest: null, settleReject: '' };
      upd(id, p => ({ ...p, category: d.category, status: 'pending_dp_verification', invoice }));
      toast('Invoice ' + no + ' diterbitkan. Menunggu verifikasi DP.');
    },
    verifyDP: (id, d) => {
      if (!canMoney) { toast('Hanya Admin Keuangan yang berhak memverifikasi uang masuk.', 'bad'); return; }
      const p = projects.find(x => x.id === id);
      if (!p || !p.invoice || p.invoice.dpStatus === 'verified') return;
      const now = new Date().toISOString();
      upd(id, x => ({ ...x, status: 'cl_design_draft', designStatus: 'draft', cl: x.cl || blankCL(x.invoice.category), invoice: { ...x.invoice, dpStatus: 'verified', dpVerifiedAt: now, dpAccount: d.account, dpRef: d.ref } }));
      setCash(cs => [{ id: uid('trx_dp'), type: 'in', category: 'income_dp', amount: p.invoice.dpNominal, client: p.client.name, note: 'Pembayaran DP Invoice ' + p.invoice.no, date: now, account: d.account }, ...cs]);
      toast('DP ' + rp(p.invoice.dpNominal) + ' terverifikasi dan masuk Buku Kas. CL & desain dibuka.');
    },
    verifySettle: (id, d) => {
      if (!canMoney) { toast('Hanya Admin Keuangan yang berhak memverifikasi uang masuk.', 'bad'); return; }
      const p = projects.find(x => x.id === id);
      if (!p || p.status !== 'pending_settlement_verification') return;
      const now = new Date().toISOString();
      upd(id, x => ({ ...x, status: 'ready_to_ship', invoice: { ...x.invoice, settleStatus: 'verified', settleVerifiedAt: now, settleAccount: d.account, settleRef: d.ref } }));
      setCash(cs => [{ id: uid('trx_lunas'), type: 'in', category: 'income_pelunasan', amount: p.invoice.remaining, client: p.client.name, note: 'Pelunasan Invoice ' + p.invoice.no, date: now, account: d.account }, ...cs]);
      toast('Pelunasan ' + rp(p.invoice.remaining) + ' terverifikasi. Pesanan siap kirim / diambil.');
    },
    saveCL: (id, cl, submit) => {
      upd(id, p => ({ ...p, cl: { ...cl, updatedAt: new Date().toISOString(), submitted: submit || cl.submitted, version: submit && p.cl.submitted ? p.cl.version + 1 : p.cl.version } }));
      toast(submit ? 'CL dikirim ke Tim Desain.' : 'Draf CL tersimpan.');
    },
    uploadMockup: (id, d) => {
      upd(id, p => ({ ...p, designStatus: 'waiting_customer_acc', mockups: [...p.mockups, { id: uid('mk'), url: d.url, note: d.note, version: 'v' + (p.mockups.length + 1), by: user.name, at: new Date().toISOString() }] }));
      toast('Mockup terkirim ke Sales untuk direview customer.');
    },
    approveCL: id => {
      const p = projects.find(x => x.id === id);
      if (!p || !p.invoice || p.invoice.dpStatus !== 'verified' || !p.cl || p.cl.locked) return;
      if (!clComplete(p.cl) || !latestMockup(p)) { toast('Lengkapi daftar personil dan tunggu mockup sebelum ACC.', 'bad'); return; }
      const spk = { no: 'SPK-' + ym() + '-' + tagOf(p) + '-' + pad(maxSuffix(projects, 'spk', p.salesCode) + 1), deadline: daysAhead(14), material: p.cl.spec.bahan || '', issuedAt: new Date().toISOString() };
      upd(id, x => ({ ...x, status: 'in_production', designStatus: 'final_approved', cl: { ...x.cl, locked: true }, spk, stageIdx: 0 }));
      toast('Desain & CL telah di-ACC Customer! ' + spk.no + ' resmi terbit ke lantai produksi.');
    },
    finishStage: (id, d) => {
      const p = projects.find(x => x.id === id);
      if (!p) return;
      const idx = p.stageIdx;
      const log = { id: uid('log'), stageIdx: idx, stageName: STAGES[idx], photo: d.photo, note: d.note, operator: d.operator, at: new Date().toISOString(), qc: d.qc };
      let next = idx + 1, status = 'in_production', msg = 'Tahap ' + STAGES[idx] + ' selesai.';
      if (idx === 5) { if (d.qc === 'perbaikan') { next = 6; status = 'in_rework'; msg = 'QC menemukan reject. Proyek dialihkan ke tahap Perbaikan.'; } else { next = 7; } }
      else if (idx === 6) { next = 5; msg = 'Perbaikan selesai. Proyek kembali ke QC.'; }
      else if (idx === 7) {
        next = 8;
        const lunas = p.invoice.remaining === 0 || p.invoice.settleStatus === 'verified';
        status = lunas ? 'ready_to_ship' : 'completed_pending_settlement';
        msg = lunas ? 'Produksi selesai. Pesanan sudah lunas dan siap kirim.' : 'Produksi selesai. Status: barang jadi, menunggu pelunasan.';
      }
      upd(id, x => ({ ...x, stageIdx: next, status, logs: [...x.logs, log] }));
      toast(msg, status === 'in_rework' ? 'warn' : 'ok');
    },
    submitSettle: (id, d) => {
      if (!canSales) { toast('Hanya Sales yang dapat mengajukan verifikasi pelunasan.', 'bad'); return; }
      const p = projects.find(x => x.id === id);
      if (!p || p.status !== 'completed_pending_settlement') return;
      const now = new Date().toISOString();
      const by = role === 'sales' ? 'Sales ' + user.name : user.name;
      upd(id, x => ({ ...x, status: 'pending_settlement_verification', invoice: { ...x.invoice, settleStatus: 'submitted', settleReject: '',
        settleRequest: { by, at: now, paidDate: d.date, account: d.account, note: d.note, proof: d.proof || null, amount: x.invoice.remaining } } }));
      toast('Pengajuan pelunasan ' + rp(p.invoice.remaining) + ' dikirim ke Finance untuk diverifikasi.');
    },
    rejectSettle: (id, reason) => {
      if (!canMoney) { toast('Hanya Admin Keuangan yang berhak memproses pengajuan pelunasan.', 'bad'); return; }
      const p = projects.find(x => x.id === id);
      if (!p || p.status !== 'pending_settlement_verification') return;
      upd(id, x => ({ ...x, status: 'completed_pending_settlement', invoice: { ...x.invoice, settleStatus: 'none', settleRequest: null, settleReject: (reason || '').trim() || 'Data pembayaran belum sesuai' } }));
      toast('Pengajuan dikembalikan ke Sales dengan catatan.', 'warn');
    },
    addExpense: d => {
      setCash(cs => [{ id: uid('trx_out'), type: 'out', category: d.category, amount: d.amount, client: '-', note: d.note, date: new Date().toISOString(), account: d.account }, ...cs]);
      toast('Pengeluaran ' + rp(d.amount) + ' dicatat. Saldo kas berkurang.', 'warn');
    },
    updateUser: async (id, patch) => {
      if (!cloud) return;
      try {
        const u = await saveUser(boot.client, id, patch);
        setUsers(list => list.map(x => (x.id === id ? u : x)));
        toast('Pengguna ' + u.name + ' diperbarui' + (u.salesCode && patch.role === 'sales' ? ' (kode ' + u.salesCode + ').' : '.'));
      } catch (e) { toast('Gagal memperbarui pengguna: ' + authMsg(e), 'bad'); }
    },
    reloadUsers: async () => {
      try { setUsers(await fetchUsers(boot.client)); toast('Daftar pengguna dimuat ulang.'); }
      catch (e) { toast('Gagal memuat pengguna: ' + authMsg(e), 'bad'); }
    }
  };
  const c = { mode: boot.mode, role, user, users, salesUsers, projects: visible, cash, period, setPeriod, canMoney, canSales, A, go, open: setModal, toast };

  const menu = ROLES[role].menu;
  const fin = finance(visible, cash);
  const badgeOf = v => {
    if (v === 'verifikasi') return fin.dpQueue.length + fin.settleQueue.length;
    if (v === 'tagihan') return fin.settleWaiting.length;
    if (v === 'prospek' && role === 'sales') return visible.filter(p => p.status === 'prospect_deal').length + fin.settleWaiting.length;
    if (v === 'desain') return visible.filter(p => p.status === 'cl_design_draft').length;
    if (v === 'cl') return visible.filter(p => p.cl && !p.cl.locked && p.invoice && p.invoice.dpStatus === 'verified' && latestMockup(p)).length;
    if (v === 'produksi') return role === 'spv_produksi' ? visible.filter(p => p.status === 'in_rework').length : visible.filter(p => p.status === 'in_production' || p.status === 'in_rework').length;
    if (v === 'pengguna') return users.filter(u => u.role === 'pending').length;
    return 0;
  };
  const labelOf = v => (MENU_LABEL[v] && (MENU_LABEL[v][role] || MENU_LABEL[v].owner || MENU_LABEL[v].sales)) || v;
  const body = { dashboard: Dashboard, prospek: ProspekView, jobs: JobsView, produksi: ProduksiView, verifikasi: VerifikasiView, kas: KasView, tagihan: TagihanView, cl: ClView, desain: DesainView, pengguna: UsersView, profil: ProfilView }[menu.includes(view) ? view : menu[0]];
  const cur = menu.includes(view) ? view : menu[0];

  if (cloud && phase !== 'ready') {
    return h`<div className="splash" id="splash">${phase === 'error' ? h`<div><p className="errline" id="load-err">${loadErr}</p><div className="row-act"><button className="btn primary" onClick=${() => { if (storeRef.current) storeRef.current.stop(); loadCloud(); }}>Coba lagi</button><button className="btn" onClick=${boot.onExit}>Keluar</button></div></div>` : 'Memuat data dari Supabase...'}</div>`;
  }

  const mobPrimary = (MOBILE_PRIMARY[role] || menu).filter(v => menu.includes(v));
  const bottomItems = menu.length > 4 ? mobPrimary.slice(0, 4) : menu;
  const moreItems = menu.filter(v => !bottomItems.includes(v));
  const moreBadge = moreItems.reduce((n, v) => n + (badgeOf(v) || 0), 0);
  const goMobile = v => { setDrawer(false); go(v); };

  return h`<div className="app">
    <header className="topbar">
      <div className="brand"><${BrandMark} />${COMPANY.tagline ? h`<small>${COMPANY.tagline}</small>` : null}</div>
      ${cloud ? h`<div className="whoami" id="whoami"><b>${user.name}</b><span>${userLabel(user)}${user.salesCode ? ' · ' + user.salesCode : ''}</span></div>`
        : h`<div className="demo"><span className="demo-label">Demo</span>
          <select id="role-switch" className="roleswitch" aria-label="Ganti peran demo" value=${userId} onChange=${e => switchUser(e.target.value)}>${DEMO_USERS.map(u => h`<option key=${u.id} value=${u.id}>${userLabel(u)}</option>`)}</select></div>`}
      <div className="top-right">
        ${cloud ? h`<${SyncBadge} s=${sync} onRetry=${() => storeRef.current && storeRef.current.flush()} />` : null}
        ${cloud ? null : h`<button className=${'reset-btn' + (confirmReset ? ' armed' : '')} onClick=${doReset}>${confirmReset ? 'Klik lagi untuk reset' : 'Reset Data Demo'}</button>`}
        <button className="reset-btn" id="btn-exit" onClick=${boot.onExit}>${cloud ? 'Keluar' : 'Keluar Mode Demo'}</button></div>
    </header>
    <div className="shell">
      <nav className="side" aria-label="Menu"><div className="side-role"><span>Peran aktif</span><b>${ROLES[role].label}</b>${role === 'sales' || cloud ? h`<small>${user.name}${user.salesCode ? ' · ' + user.salesCode : ''}</small>` : null}</div>
        <ul>${menu.map(v => h`<li key=${v}><button className=${cur === v ? 'on' : ''} aria-current=${cur === v ? 'page' : null} onClick=${() => go(v)}><span className="ni"><${Ico} n=${MENU_ICON[v]} s=${18} /></span><span className="nl">${labelOf(v)}</span><span className="ns">${MENU_SHORT[v]}</span>${badgeOf(v) ? h`<em className="nav-badge" title="Perlu tindakan">${badgeOf(v)}</em>` : null}</button></li>`)}</ul>
        <p className="side-note">${cloud ? 'Data tersimpan di Supabase dan tersinkron ke semua perangkat Anda.' : 'Mode Demo: data hanya tersimpan di browser ini. Keluar dari mode demo untuk masuk dengan akun.'}</p></nav>
      <main className="main"><h1 className="page-title">${labelOf(cur)}</h1><${body} c=${c} /></main>
    </div>
    <nav className="bnav" id="bnav" aria-label="Menu utama">
      ${bottomItems.map(v => h`<button key=${v} className=${cur === v ? 'on' : ''} aria-current=${cur === v ? 'page' : null} onClick=${() => goMobile(v)}><${Ico} n=${MENU_ICON[v]} s=${20} /><span>${MENU_SHORT[v]}</span>${badgeOf(v) ? h`<em className="nav-badge">${badgeOf(v)}</em>` : null}</button>`)}
      <button id="bnav-more" className=${moreItems.includes(cur) || drawer ? 'on' : ''} aria-haspopup="dialog" aria-expanded=${drawer} onClick=${() => setDrawer(true)}><${Ico} n="more" s=${20} w=${4} /><span>Lainnya</span>${moreBadge ? h`<em className="nav-badge">${moreBadge}</em>` : null}</button>
    </nav>
    <div className="toasts" role="status" aria-live="polite">${toasts.map(t => h`<div key=${t.id} className=${'toast t-' + t.tone}>${t.text}</div>`)}</div>
    ${drawer ? h`<${Modal} title="Menu lainnya" onClose=${() => setDrawer(false)}>
      <div className="sheet-acct"><b>${user.name}</b><span>${userLabel(user)}${user.salesCode ? ' · ' + user.salesCode : ''}${cloud ? '' : ' · Mode Demo'}</span></div>
      ${moreItems.length ? h`<ul className="sheet-list" id="sheet-menu">${moreItems.map(v => h`<li key=${v}><button className=${cur === v ? 'on' : ''} onClick=${() => goMobile(v)}><${Ico} n=${MENU_ICON[v]} s=${20} /><span className="nl">${labelOf(v)}</span>${badgeOf(v) ? h`<em className="nav-badge">${badgeOf(v)}</em>` : null}</button></li>`)}</ul>` : null}
      <div className="sheet-actions">${cloud ? null : h`<button className=${'btn' + (confirmReset ? ' danger' : '')} id="btn-reset-m" onClick=${doReset}>${confirmReset ? 'Klik lagi untuk reset' : 'Reset Data Demo'}</button>`}
        <button className="btn" id="btn-exit-m" onClick=${() => { setDrawer(false); boot.onExit(); }}>${cloud ? 'Keluar' : 'Keluar Mode Demo'}</button></div><//>` : null}
    ${modal && modal.type === 'invoice' ? h`<${InvoiceModal} c=${c} pid=${modal.pid} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'cl' ? h`<${ClModal} c=${c} pid=${modal.pid} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'mockup' ? h`<${MockupModal} c=${c} pid=${modal.pid} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'progress' ? h`<${ProgressModal} c=${c} pid=${modal.pid} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'expense' ? h`<${ExpenseModal} c=${c} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'doc' ? h`<${DocModal} c=${c} pid=${modal.pid} type=${modal.doc} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'settle' ? h`<${SettleModal} c=${c} pid=${modal.pid} onClose=${() => setModal(null)} />` : null}
    ${modal && modal.type === 'photo' ? h`<${Modal} title=${modal.title || 'Foto'} onClose=${() => setModal(null)}><img className="bigimg" src=${modal.src} alt=${modal.title || 'Foto'} /><//>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h`<${Root} />`);
})();
</script>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
</body>
</html>
