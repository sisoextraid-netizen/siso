<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SISO EXTRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* SISO EXTRA · dark zinc, B2B SaaS. Satu tema gelap. Sans: Geist. Angka dan kode: Geist Mono.
   Breakpoint: desktop >= 1024, tablet 768-1023 (icon rail), mobile < 768 (bottom nav), bottom sheet < 640. */
:root {
  --bg: #09090b; --surface: #121215; --surface2: #18181b; --surface3: #1f1f23;
  --line: #27272a; --line2: #3f3f46;
  --ink: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-ink: #ffffff; --accent-text: #60a5fa;
  --accent-soft: rgba(37, 99, 235, .14); --accent-line: rgba(37, 99, 235, .35);
  --ok: #34d399; --ok-soft: rgba(2, 44, 34, .4); --ok-line: rgba(6, 95, 70, .4);
  --warn: #fbbf24; --warn-soft: rgba(69, 26, 3, .4); --warn-line: rgba(146, 64, 14, .4);
  --bad: #fb7185; --bad-soft: rgba(76, 5, 25, .4); --bad-line: rgba(159, 18, 57, .4);
  --neutral-soft: rgba(39, 39, 42, .5); --neutral-line: rgba(63, 63, 70, .5);
  --paper: #ffffff; --paper-ink: #18181b; --paper-line: #e4e4e7; --paper-soft: #f4f4f5; --paper-mute: #71717a;
  --f-sans: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'Geist Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --top-h: 48px; --side-w: 232px; --bnav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 13px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { text-wrap: balance; font-weight: 500; }
p { text-wrap: pretty; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ico { flex: none; }
::selection { background: rgba(96, 165, 250, .3); }

/* ---------- Kerangka ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--top-h); background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 16px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.brand b { font: 600 14px/1 var(--f-sans); letter-spacing: .04em; }
.brand span { font: 500 11px/1 var(--f-sans); letter-spacing: .14em; color: var(--dim); }
.brand small { display: none; }
.brand .brand-logo { height: 24px; max-width: 48px; object-fit: contain; }
.demo { display: flex; align-items: center; gap: 8px; min-width: 0; }
.demo-label { font: 500 10px/1 var(--f-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; padding: 3px 6px; white-space: nowrap; }
.roleswitch { height: 30px; background: var(--surface2); border: 1px solid var(--line); border-radius: 7px; padding: 0 28px 0 10px; font-weight: 500; font-size: 12.5px; min-width: 150px; }
.whoami { display: grid; gap: 0; min-width: 0; }
.whoami b { font: 500 13px/1.2 var(--f-sans); }
.whoami span { font-size: 11px; color: var(--dim); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.reset-btn { background: transparent; border: 1px solid var(--line); color: var(--muted); height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
.reset-btn:hover { background: var(--surface2); color: var(--ink); }
.reset-btn.armed { border-color: var(--warn-line); color: var(--warn); background: var(--warn-soft); }
.syncbadge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 9px; height: 28px; white-space: nowrap; }
.syncbadge i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.syncbadge.st-ok i { background: var(--ok); }
.syncbadge.st-warn i { background: var(--warn); }
.syncbadge.st-bad i { background: var(--bad); }
.syncbadge.st-bad { color: var(--bad); border-color: var(--bad-line); }
.syncbadge .linkbtn { padding: 0; color: var(--accent-text); }

.shell { flex: 1; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); align-items: start; }
.side { position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; padding: 16px 12px; border-right: 1px solid var(--line); }
.side-role { padding: 0 10px 14px; display: grid; gap: 1px; }
.side-role span { font: 500 11px/1.2 var(--f-sans); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.side-role b { font: 500 13px/1.3 var(--f-sans); }
.side-role small { color: var(--muted); font-size: 12px; }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side li button { position: relative; width: 100%; text-align: left; display: flex; align-items: center; gap: 8px; background: transparent; border: 0; padding: 0 10px; min-height: 32px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 13px; }
.side li button:hover { background: var(--surface2); color: var(--ink); }
.side li button.on { background: var(--surface2); color: var(--ink); }
.side li button.on::before { content: ''; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 2px; background: var(--ink); border-radius: 2px; }
.side .ni, .side .ns { display: none; }
.side .nl { flex: 1; min-width: 0; }
.nav-badge { font-style: normal; font: 600 11px/1 var(--f-mono); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; display: inline-grid; place-items: center; background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); flex: none; }
.side-note { margin: 16px 10px 0; font-size: 11.5px; color: var(--dim); line-height: 1.5; }
.main { padding: 24px 28px 64px; min-width: 0; max-width: 1232px; width: 100%; }
.page-title { font: 600 20px/1.2 var(--f-sans); letter-spacing: -.01em; margin-bottom: 16px; }
.stack { display: grid; gap: 16px; min-width: 0; }
.sec { font: 500 15px/1.3 var(--f-sans); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.mini { font: 500 11px/1.3 var(--f-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h3 { font: 500 15px/1.3 var(--f-sans); }
.card-head .muted { font-size: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.two.tight { gap: 14px; }

.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.statgrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; text-align: left; }
.stat span { font: 500 11px/1.3 var(--f-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.stat b { font: 600 22px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; letter-spacing: -.02em; }
.stat small { color: var(--muted); font-size: 12px; }
button.stat.linkstat { font: inherit; color: inherit; cursor: pointer; width: 100%; }
button.stat.linkstat:hover { border-color: var(--line2); background: var(--surface2); }

.callout { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.callout.warnbox { background: var(--warn-soft); border-color: var(--warn-line); justify-content: flex-start; color: var(--warn); }
.callout.badbox { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); justify-content: flex-start; }
.callout.infobox { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); justify-content: flex-start; }

/* ---------- Tombol ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--surface2); border: 1px solid var(--line2); color: var(--ink); height: 32px; padding: 0 12px; border-radius: 7px; font-weight: 500; font-size: 13px; text-decoration: none; line-height: 1.2; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface3); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ok, .btn.wa { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.btn.ok:hover:not(:disabled), .btn.wa:hover:not(:disabled) { background: rgba(2, 44, 34, .7); }
.btn.danger { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.btn.on { background: var(--surface3); border-color: var(--line2); color: var(--ink); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { background: transparent; border: 0; padding: 6px; border-radius: 6px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover:not(:disabled) { background: var(--surface2); color: var(--ink); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.linkbtn { background: none; border: 0; color: var(--accent-text); padding: 8px 0 0; font-weight: 500; text-align: left; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- Badge ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; line-height: 1.5; }
.t-neutral, .t-muted { background: var(--neutral-soft); color: var(--muted); border-color: var(--neutral-line); }
.t-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
.t-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.t-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
.t-accent { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-line); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Daftar dan baris ---------- */
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px 18px; justify-content: space-between; align-items: center; flex-wrap: wrap; min-width: 0; }
.row.col { flex-direction: column; align-items: stretch; flex-wrap: nowrap; gap: 12px; }
.row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.row-main { display: grid; gap: 2px; min-width: 0; flex: 1 1 240px; }
.row-main b { font: 500 14px/1.35 var(--f-sans); }
.row-main span { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.row-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.amt { font: 600 15px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.figs { display: flex; gap: 8px 28px; flex-wrap: wrap; }
.figs div { display: grid; gap: 2px; }
.figs span { font: 500 11px/1.3 var(--f-sans); text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.figs b { font: 500 14px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.salestag { display: inline-block; font-size: 12px; color: var(--muted); font-weight: 400; }

/* ---------- Form ---------- */
select, input, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; height: 32px; padding: 0 10px; min-width: 0; font-size: 13px; }
textarea { height: auto; padding: 8px 10px; width: 100%; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--dim); }
select:disabled, input:disabled { opacity: .55; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="checkbox"] { height: auto; accent-color: var(--accent); }
input[type="file"] { height: auto; padding: 6px 8px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font: 500 11px/1.3 var(--f-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field small { color: var(--dim); font-size: 12px; }
.field input, .field select { width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .span2 { grid-column: 1 / -1; }
.right { text-align: right; }
.form-inline { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: end; }
.empty { border: 1px dashed var(--line2); border-radius: 10px; padding: 20px; color: var(--dim); text-align: center; }
.errline { color: var(--bad); font-size: 12.5px; }
.infoline { color: var(--ok); font-size: 12.5px; background: var(--ok-soft); border: 1px solid var(--ok-line); border-radius: 7px; padding: 8px 10px; }
.hintline { display: flex; gap: 6px; align-items: center; color: var(--warn); font-size: 12.5px; margin-top: 6px; }
.note { margin-top: 8px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 7px; font-size: 12.5px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chips button { background: transparent; border: 1px solid var(--line); border-radius: 6px; height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.chips button:hover { background: var(--surface2); color: var(--ink); }
.chips button.on { background: var(--surface3); border-color: var(--line2); color: var(--ink); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.seg button { background: transparent; border: 0; height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 500; color: var(--muted); font-size: 12.5px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface3); color: var(--ink); box-shadow: 0 0 0 1px var(--line2); }
.seg button.on.bad { background: var(--bad-soft); color: var(--bad); box-shadow: 0 0 0 1px var(--bad-line); }

/* ---------- Mutasi kas ---------- */
.cashlist { list-style: none; padding: 0; margin: 0; }
.cashlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main amt"; gap: 4px 16px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.cashlist li:first-child { border-top: 0; }
.cl-main { grid-area: main; display: grid; gap: 2px; min-width: 0; }
.cl-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cl-top b { font-weight: 500; }
.cl-main span { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.cl-amt { grid-area: amt; font: 500 14px/1.4 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.cl-amt.in { color: var(--ok); } .cl-amt.out { color: var(--ink); }

.pipe { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.pipe li { padding: 8px 0; border-top: 1px solid var(--line); color: var(--dim); }
.pipe li:first-child { border-top: 0; }
.pipe li.has { color: var(--ink); }
.pipe-top { display: flex; justify-content: space-between; gap: 10px; }
.pipe-top b { font: 500 13px/1.4 var(--f-mono); }
.pipe-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.pipe-chips em { font-style: normal; font-size: 11.5px; background: var(--neutral-soft); color: var(--muted); border: 1px solid var(--neutral-line); padding: 1px 8px; border-radius: 5px; }

/* ---------- Tahap produksi ---------- */
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.stepper li { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 11px; color: var(--dim); border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; }
.stepper li i { width: 18px; height: 18px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line2); display: grid; place-items: center; font-style: normal; font: 500 10.5px/1 var(--f-mono); }
.stepper li span { overflow-wrap: anywhere; line-height: 1.2; }
.stepper li.done { border-top-color: var(--ok); color: var(--muted); }
.stepper li.done i { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.stepper li.cur { border-top-color: var(--ink); color: var(--ink); font-weight: 500; }
.stepper li.cur i { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.stepper li.cur.bad { border-top-color: var(--bad); } .stepper li.cur.bad i { background: var(--bad); border-color: var(--bad); color: var(--bg); }

.sizegrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sizegrid div { border: 1px solid var(--line); border-radius: 7px; padding: 5px 2px; text-align: center; background: var(--bg); }
.sizegrid span { display: block; font: 500 10px/1.3 var(--f-sans); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
.sizegrid b { font: 500 16px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.sizegrid .tot { background: var(--surface2); }
.speclist { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; }
.speclist li { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr); gap: 8px; }
.speclist b { color: var(--dim); font-weight: 500; }
.lastlog { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.lastlog.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.lastlog img { width: 84px; height: 56px; object-fit: cover; border-radius: 5px; cursor: zoom-in; flex: none; }
.lastlog div { display: grid; min-width: 0; font-size: 12.5px; }
.lastlog small { color: var(--dim); }
.bigimg { width: 100%; height: auto; border-radius: 8px; }

.cl-split { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; align-items: start; }
.thumb { display: grid; gap: 4px; }
.thumb img { width: 100%; max-height: 150px; object-fit: contain; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
.thumb small { color: var(--dim); text-align: center; }
.thumb-empty { aspect-ratio: 16 / 10; display: grid; place-items: center; text-align: center; padding: 8px; border: 1px dashed var(--line2); border-radius: 7px; color: var(--dim); font-size: 12px; }
.cl-sum { display: grid; gap: 8px; min-width: 0; }
.mockrow { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.mockrow figure { margin: 0; flex: none; width: 190px; }
.mockrow img { width: 100%; height: 120px; object-fit: contain; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
.mockrow figcaption { font-size: 12px; color: var(--dim); }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 12.5px; }
.dl dt { color: var(--dim); } .dl dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- Tabel ---------- */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.scroll.small { max-height: 220px; overflow-y: auto; }
.scroll.tall { max-height: 320px; overflow-y: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; color: inherit; }
.tbl th { text-align: left; background: var(--surface2); padding: 7px 8px; font: 500 11px/1.3 var(--f-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); position: sticky; top: 0; }
.tbl td { padding: 5px 8px; border-top: 1px solid var(--line); }
.tbl .num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl .strong { font-weight: 600; }
.tbl.edit input, .tbl.edit select { width: 100%; min-width: 90px; }
.tbl.edit td.num input { min-width: 70px; text-align: right; }
.paste { margin: 8px 0; } .paste summary { cursor: pointer; color: var(--accent-text); font-weight: 500; margin-bottom: 6px; }
.dpbox { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: end; }
.sumbox { display: grid; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }

.ptable td select { max-width: 100%; }
.piu-groups { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }

.per-now b { font: 500 15px/1.3 var(--f-sans); }
.periodbar .push { margin-left: auto; }

/* ---------- Kanban ---------- */
.kanban { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
.kcol { min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 120px; }

.rejects small { color: var(--dim); }

/* ---------- Modal, bottom sheet ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 512px; max-height: 100%; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 24px 64px rgba(0, 0, 0, .55); }
.modal.wide { max-width: 880px; }
.modal-head { display: flex; justify-content: space-between; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.modal-head h2 { font: 600 15px/1.3 var(--f-sans); }
.modal-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.modal-body { padding: 16px; overflow-y: auto; display: grid; grid-auto-rows: max-content; gap: 12px; align-content: start; min-height: 0; }
.modal-body > * { min-width: 0; }
.modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface); border-radius: 0 0 12px 12px; }
.modal-foot .muted, .modal-foot .msg { margin-right: auto; font-size: 12.5px; }
.msg.t-ok { color: var(--ok); background: none; border: 0; } .msg.t-bad { color: var(--bad); background: none; border: 0; } .msg.t-neutral { background: none; border: 0; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 80; width: max-content; max-width: min(420px, calc(100% - 24px)); pointer-events: none; }
.toast { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface3); box-shadow: 0 8px 28px rgba(0, 0, 0, .5); font-size: 12.5px; border-left-width: 3px; color: var(--ink); }
.toast.t-ok { border-left-color: var(--ok); }
.toast.t-warn { border-left-color: var(--warn); }
.toast.t-bad { border-left-color: var(--bad); }

.alertbox { border: 1px solid var(--warn-line); background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.alert-head { display: flex; gap: 8px; align-items: center; color: var(--warn); }
.alert-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alert-list li { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink); }

.alert-list span, .alert-list small { color: var(--muted); font-size: 12.5px; }
.alert-list small.bad-text { color: var(--bad); }
.reqbox { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

.rejectrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }

.specgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.specitem { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; align-content: start; background: var(--bg); min-width: 0; }
.specimg { display: grid; gap: 6px; justify-items: start; }
.specimg img { width: 100%; max-height: 140px; object-fit: contain; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.pastebox { display: grid; gap: 8px; }
.specthumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.specthumb { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px; display: grid; gap: 2px; width: 96px; text-align: center; font-size: 11px; color: var(--dim); }
.specthumb img { width: 100%; height: 62px; object-fit: cover; border-radius: 4px; }

/* ---------- Dokumen (kertas tetap putih): gaya faktur studio ---------- */
.paperwrap { overflow-x: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.paper { background: var(--paper); color: var(--paper-ink); min-width: 560px; max-width: 794px; margin: 0 auto; padding: 32px 36px 36px; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); font-size: 11.5px; line-height: 1.5; font-family: var(--f-sans); }
.pp-id { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.pp-logo { max-height: 52px; max-width: 110px; object-fit: contain; flex: none; }
.pp-head { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--paper-line); padding-bottom: 14px; margin-bottom: 16px; }
.pp-brand { font: 600 17px/1.2 var(--f-sans); letter-spacing: .02em; }
.pp-sub { color: var(--paper-mute); font-size: 10.5px; }
.pp-right { text-align: right; display: grid; gap: 2px; justify-items: end; align-content: start; }

.pp-badge { margin-top: 6px; border: 1px solid; border-radius: 5px; padding: 1px 7px; font: 500 9.5px/1.6 var(--f-sans); letter-spacing: .06em; background: transparent !important; }
.pp-badge.t-ok { color: #047857; border-color: #a7d7c5; } .pp-badge.t-warn { color: #b45309; border-color: #e9c99b; } .pp-badge.t-neutral { color: #52525b; border-color: #d4d4d8; }
.pp-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; margin-bottom: 8px; }
.pp-kv span { display: block; font: 500 9px/1.4 var(--f-sans); text-transform: uppercase; letter-spacing: .1em; color: var(--paper-mute); }
.pp-kv b { overflow-wrap: anywhere; font-weight: 500; }
.pp-h { font: 500 9.5px/1.3 var(--f-sans); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute); border-bottom: 1px solid var(--paper-line); padding-bottom: 5px; margin: 20px 0 8px; }
.pp-tablewrap { margin-bottom: 8px; }
.pp-table { width: 100%; border-collapse: collapse; table-layout: fixed; color: var(--paper-ink); font: inherit; }
.pp-table th, .pp-table td { padding: 6px 6px; overflow-wrap: anywhere; vertical-align: top; border-bottom: 1px solid var(--paper-line); }
.pp-table th { font: 500 9px/1.4 var(--f-sans); text-transform: uppercase; letter-spacing: .08em; color: var(--paper-mute); border-bottom-color: #d4d4d8; }
.pp-table td.m { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.pp-table tr { page-break-inside: avoid; }
.pp-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; margin: 14px 0; align-items: start; }
.pp-box { border-left: 2px solid var(--paper-line); padding: 2px 0 2px 12px; display: grid; gap: 2px; font-size: 11px; }
.pp-box b { font: 500 9px/1.4 var(--f-sans); text-transform: uppercase; letter-spacing: .1em; color: var(--paper-mute); margin-bottom: 2px; }
.pp-sum { display: grid; gap: 6px; }
.pp-sum div { display: flex; justify-content: space-between; gap: 8px; }
.pp-sum span { color: var(--paper-mute); }
.pp-sum b { font: 500 12px/1.4 var(--f-mono); font-variant-numeric: tabular-nums; }
.pp-sum .strong { border-top: 1px solid var(--paper-ink); padding-top: 6px; }
.pp-sum .strong span { color: var(--paper-ink); font-weight: 500; }
.pp-sum .strong b { font-size: 14px; font-weight: 600; }
.pp-img { margin: 0 0 8px; background: #fafafa; border: 1px solid var(--paper-line); padding: 8px; text-align: center; border-radius: 4px; }
.pp-img img { max-width: 100%; max-height: 330px; object-fit: contain; }
.pp-img figcaption { font-size: 10px; color: var(--paper-mute); margin-top: 4px; }
.pp-text { margin: 8px 0; } .pp-text b { font: 500 9px/1.4 var(--f-sans); text-transform: uppercase; letter-spacing: .1em; color: var(--paper-mute); } .pp-text p { margin-top: 2px; white-space: pre-wrap; }
.pp-sizes { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0; border: 1px solid var(--paper-line); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
.pp-sizes div { text-align: center; padding: 8px 2px; border-left: 1px solid var(--paper-line); }
.pp-sizes div:first-child { border-left: 0; }
.pp-sizes span { display: block; font: 500 9px/1.4 var(--f-sans); color: var(--paper-mute); letter-spacing: .08em; }
.pp-sizes b { font: 500 20px/1.2 var(--f-mono); }
.pp-sizes .tot { background: var(--paper-soft); }
.pp-sign { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; margin-top: 24px; text-align: center; }
.pp-sign div { display: grid; gap: 4px; }
.pp-sign span { color: var(--paper-mute); font-size: 10.5px; }
.pp-sign i { display: block; height: 64px; border-bottom: 1px solid #a1a1aa; }
.pp-sign b { font-weight: 500; }
.pp-specimgs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.pp-specimgs figure { margin: 0; border: 1px solid var(--paper-line); padding: 4px; background: #fafafa; border-radius: 4px; page-break-inside: avoid; }
.pp-specimgs img { width: 100%; height: 120px; object-fit: contain; display: block; }
.pp-specimgs figcaption { font: 500 9px/1.4 var(--f-sans); text-transform: uppercase; letter-spacing: .08em; color: var(--paper-mute); margin-top: 3px; text-align: center; }

/* ---------- Masuk, pendaftaran ---------- */
.splash { min-height: 100vh; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
.authwrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); background: var(--bg); }
.authbrand { background: var(--surface); border-right: 1px solid var(--line); padding: 48px 44px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.authbrand .brand b { font-size: 18px; } .authbrand .brand span { font-size: 12px; }
.authbrand .brand .brand-logo { height: 36px; max-width: 80px; }
.authbrand .tagline { color: var(--muted); font-size: 14px; margin-top: 10px; }
.authbrand ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; max-width: 340px; }
.authbrand li { color: var(--muted); font-size: 13px; padding-left: 14px; border-left: 1px solid var(--line2); }
.authmain { display: flex; flex-direction: column; min-width: 0; }
.authcard { padding: 56px 40px 24px; max-width: 460px; width: 100%; margin: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; justify-content: center; }
.authfoot { display: flex; justify-content: flex-end; padding: 14px 20px; }
.auth-title { font: 600 20px/1.2 var(--f-sans); letter-spacing: -.01em; }
.authtabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; align-self: flex-start; }
.authtabs button { background: transparent; border: 0; height: 28px; padding: 0 16px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.authtabs button.on { background: var(--surface3); color: var(--ink); box-shadow: 0 0 0 1px var(--line2); }
.authform { display: grid; gap: 14px; }
.authlinks { display: flex; justify-content: flex-end; }
.authlinks .linkbtn { padding: 0; }
.authsep { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; }
.authsep::before, .authsep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.authcard .callout { flex-wrap: nowrap; justify-content: flex-start; align-items: flex-start; gap: 10px; }
.authcard .callout .ico { margin-top: 2px; }
.gearbtn { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; color: var(--dim); font-size: 12px; padding: 6px 8px; border-radius: 6px; }
.gearbtn:hover { color: var(--ink); background: var(--surface2); }
.cfgform { display: grid; gap: 12px; }
.cfgform input { word-break: break-all; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; }
.you { margin-left: 8px; font-style: normal; font-size: 11px; background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-line); border-radius: 5px; padding: 0 6px; }

/* ---------- Profil brand ---------- */
.brandform { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.brandform .span2 { grid-column: 1 / -1; }
.brandform textarea { width: 100%; resize: vertical; }
.logobox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logoprev { width: 120px; height: 72px; border: 1px dashed var(--line2); border-radius: 8px; display: grid; place-items: center; background: repeating-conic-gradient(#ffffff0d 0 25%, transparent 0 50%) 0 0 / 14px 14px; overflow: hidden; }
.logoprev img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logoprev span { font-size: 11px; color: var(--dim); padding: 4px; text-align: center; }
.acctrow { display: grid; grid-template-columns: 1fr 1.2fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.kopprev .paper { min-width: 0; padding: 18px 20px; box-shadow: none; border-radius: 6px; }
.kopprev .pp-head { margin-bottom: 0; }

/* ---------- Navigasi bawah (mobile) dan drawer ---------- */
.bnav { display: none; }
.sheet-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sheet-list button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 0 12px; min-height: 48px; color: var(--ink); font-weight: 500; font-size: 14px; }
.sheet-list button:hover { background: var(--surface2); }
.sheet-list button.on { background: var(--surface2); box-shadow: inset 2px 0 0 var(--ink); }
.sheet-list .nl { flex: 1; }
.sheet-acct { display: grid; gap: 2px; padding: 4px 12px 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.sheet-acct b { font-weight: 500; font-size: 14px; } .sheet-acct span { color: var(--muted); font-size: 12px; }
.sheet-actions { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: no-preference) {
  .btn, .side li button, .chips button, .seg button { transition: background-color .12s, border-color .12s, color .12s; }
  @keyframes sheetup { from { transform: translateY(32px); } to { transform: none; } }
}

/* ========== Tablet 768-1023: icon rail ========== */
@media (max-width: 1023px) {
  :root { --side-w: 76px; }
  .main { padding: 20px 20px 56px; }
  .side { padding: 12px 8px; }
  .side-role, .side-note { display: none; }
  .side li button { flex-direction: column; justify-content: center; gap: 3px; padding: 8px 2px; min-height: 52px; text-align: center; }
  .side li button.on::before { left: -8px; top: 10px; bottom: 10px; }
  .side .ni { display: inline-flex; }
  .side .nl { display: none; }
  .side .ns { display: block; font-size: 10px; line-height: 1.2; font-weight: 500; }
  .side .nav-badge { position: absolute; top: 3px; right: 6px; min-width: 16px; height: 16px; font-size: 10px; padding: 0 4px; }
  .statgrid, .statgrid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .roleswitch { min-width: 130px; }
  .ptable { min-width: 560px; }
  .ptable th, .ptable td { padding-left: 8px; padding-right: 8px; }
  .authwrap { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
  .authbrand { padding: 36px 28px; }
}

/* ========== Mobile < 768 ========== */
@media (max-width: 767px) {
  :root { --top-h: 48px; }
  body { padding-bottom: 0; }
  .topbar { height: 48px; padding: 0 12px; gap: 10px; }
  .brand span, .demo-label, .whoami, .top-right .reset-btn { display: none; }
  .roleswitch { height: 32px; min-width: 0; max-width: 168px; border-radius: 99px; padding-left: 12px; font-size: 12px; background-color: var(--surface3); }
  .top-right { gap: 6px; }
  .syncbadge span { display: none; }
  .syncbadge { padding: 0 8px; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding: 16px 14px calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px) + 24px); }

<script>
(function(){
const { useState, useMemo, useEffect, useRef, Fragment } = React;
const h = htm.bind(React.createElement);
/* ---------- Data, helpers, mock state ---------- */
const COMPANY = {
  name: 'SISO EXTRA',
  tagline: 'Apparel & Printing Production',
  address: '',
  logo: '', logoW: 0, logoH: 0,
  wa: '0823-2078-1420',
  accounts: [
    { bank: 'Bank BCA', no: '8105913318', holder: 'Rizal Nurdian', src: 'BCA' },
    { bank: 'DANA / GoPay', no: '082320781420', holder: 'Rizal Nurdian', src: 'DANA' }
  ]
};

/* ---------- Profil brand (white label): hanya tampilan, disimpan di browser ---------- */
const BRAND_KEY = 'SISO EXTRA-brand-v1';
const BRAND_DEFAULT = JSON.parse(JSON.stringify(COMPANY));
const brandSubs = new Set();
function applyBrand(b) {
  const d = BRAND_DEFAULT;
  const str = (v, f) => (typeof v === 'string' && v.trim() ? v.trim() : f);
  COMPANY.name = str(b && b.name, d.name);
  COMPANY.tagline = b && typeof b.tagline === 'string' ? b.tagline.trim() : d.tagline;
  COMPANY.address = b && typeof b.address === 'string' ? b.address.trim() : d.address;
  COMPANY.wa = b && typeof b.wa === 'string' ? b.wa.trim() : d.wa;
  const okLogo = b && typeof b.logo === 'string' && /^data:image\//.test(b.logo) && b.logoW > 0 && b.logoH > 0;
  COMPANY.logo = okLogo ? b.logo : ''; COMPANY.logoW = okLogo ? b.logoW : 0; COMPANY.logoH = okLogo ? b.logoH : 0;
  COMPANY.accounts = b && Array.isArray(b.accounts)
    ? b.accounts.map(a => ({ bank: String((a && a.bank) || '').trim(), no: String((a && a.no) || '').trim(), holder: String((a && a.holder) || '').trim(), src: String((a && a.src) || '').trim() })).filter(a => a.bank || a.no)
    : d.accounts.map(a => Object.assign({}, a));
  try { document.title = COMPANY.name; } catch (e) { /* abaikan */ }
  brandSubs.forEach(f => f());
}
function brandSnapshot() {
  return { name: COMPANY.name, tagline: COMPANY.tagline, address: COMPANY.address, wa: COMPANY.wa, logo: COMPANY.logo, logoW: COMPANY.logoW, logoH: COMPANY.logoH, accounts: COMPANY.accounts.map(a => Object.assign({}, a)) };
}
function saveBrand() { try { window.localStorage.setItem(BRAND_KEY, JSON.stringify(brandSnapshot())); return true; } catch (e) { return false; } }
function resetBrand() { try { window.localStorage.removeItem(BRAND_KEY); } catch (e) { /* abaikan */ } applyBrand(null); }
function loadBrand() { try { const r = window.localStorage.getItem(BRAND_KEY); if (r) applyBrand(JSON.parse(r)); } catch (e) { /* abaikan */ } }
function useBrand() {
  const [, setT] = useState(0);
  useEffect(() => { const f = () => setT(x => x + 1); brandSubs.add(f); return () => { brandSubs.delete(f); }; }, []);
  return COMPANY;
}
/* nama untuk nama berkas: bawaan tetap "SISO EXTRA" supaya nama berkas lama tidak berubah */
const brandSlug = () => (COMPANY.name === BRAND_DEFAULT.name ? 'SISO EXTRA' : (safeName(COMPANY.name) || 'Brand'));
/* kop & logo: kata pertama tebal, sisanya kecil */
const brandParts = () => { const w = COMPANY.name.trim().split(/\s+/); return { first: w[0].toUpperCase(), rest: w.slice(1).join(' ').toUpperCase() }; };

const ROLES = {
  owner: { label: 'Owner', menu: ['dashboard', 'prospek', 'jobs', 'produksi', 'verifikasi', 'kas', 'pengguna', 'profil'] },
  admin_keuangan: { label: 'Admin Keuangan', menu: ['dashboard', 'verifikasi', 'kas'] },
  spv_produksi: { label: 'SPV Produksi', menu: ['produksi'] },
  sales: { label: 'Sales', menu: ['prospek', 'tagihan', 'cl'] },

  kru_lapangan: { label: 'Kru Lapangan', menu: ['produksi'] }

  { id: 'u-fin', name: 'Admin Keuangan', email: 'keuangan@demo.local', role: 'admin_keuangan', salesCode: null, active: true },
  { id: 'u-spv', name: 'SPV Produksi', email: 'spv@demo.local', role: 'spv_produksi', salesCode: null, active: true },
  { id: 'u-s1', name: 'Rina', email: 'rina@demo.local', role: 'sales', salesCode: 'S-01', active: true },
  { id: 'u-s2', name: 'Dimas', email: 'dimas@demo.local', role: 'sales', salesCode: 'S-02', active: true },
  { id: 'u-des', name: 'Kru Desain', email: 'desain@demo.local', role: 'kru_desain', salesCode: null, active: true },

/* Label tombol / identitas pengguna: Sales ditampilkan beserta namanya. */
const userLabel = u => (u.role === 'sales' ? 'Sales ' + u.name : roleLabel(u.role));
const codeTag = c => String(c || '').replace('-', '');
const salesText = p => (p && p.salesName ? p.salesName + (p.salesCode ? ' (' + p.salesCode + ')' : '') : '-');

const MENU_LABEL = {
  dashboard: { owner: 'Dashboard Eksekutif', admin_keuangan: 'Dashboard Keuangan' },
  prospek: { owner: 'Pipeline Prospek', sales: 'Pipeline Prospek (CRM)' },
  jobs: { owner: 'Job Orders (JO)' },
  produksi: { owner: 'Monitoring Produksi', spv_produksi: 'Kanban SPK 8 Tahap', kru_lapangan: 'Antrean SPK Lapangan' },
  verifikasi: { owner: 'Verifikasi DP & Pelunasan', admin_keuangan: 'Verifikasi DP & Pelunasan' },
  kas: { owner: 'Buku Kas', admin_keuangan: 'Buku Kas' },
  tagihan: { sales: 'Invoice & Tagihan' },
  cl: { sales: 'CL & Review Desain' },
  desain: { kru_desain: 'Antrean Desain & Mockup' },
  pengguna: { owner: 'Pengguna & Sales' },
  profil: { owner: 'Profil Brand' }
};

const STAGES = ['Beli Bahan', 'Potong (Cutting)', 'Sablon/Bordir', 'Jahit', 'Finishing', 'QC', 'Perbaikan', 'Selesai'];
const SIZES = ['S', 'M', 'L', 'XL', 'XXL', 'Custom'];
const SPEC_FIELDS = [
  ['dadaKiri', 'Dada Kiri'], ['dadaKanan', 'Dada Kanan'], ['lenganKiri', 'Lengan Kiri'],
  ['lenganKanan', 'Lengan Kanan'], ['punggung', 'Punggung Belakang'], ['kerah', 'Kerah']
];
const SPEC_IMG_KEYS = ['dadaKiri', 'dadaKanan', 'lenganKiri', 'lenganKanan', 'punggung'];
const specImgs = cl => SPEC_FIELDS.filter(f => SPEC_IMG_KEYS.includes(f[0]) && cl && cl.specImages && cl.specImages[f[0]]).map(f => ({ key: f[0], label: f[1], src: cl.specImages[f[0]] }));
const normSize = v => {
  const u = String(v || '').trim().toUpperCase();
  if (!u) return 'L';
  return ['S', 'M', 'L', 'XL', 'XXL'].includes(u) ? u : 'Custom';
};
const CASH_CATS = {
  opening: 'Saldo Awal', income_dp: 'DP Masuk', income_pelunasan: 'Pelunasan Masuk',
  expense_bahan: 'Belanja Bahan Kain', expense_sablon: 'Sablon/Bordir', expense_upah: 'Upah', expense_ops: 'Operasional'
};
const EXPENSE_CATS = ['expense_bahan', 'expense_sablon', 'expense_upah', 'expense_ops'];
/* Sumber kas di Buku Kas: diambil dari rekening di Profil Brand + kas tunai.
   Nilai yang tersimpan di data tetap teks biasa (tidak ada perubahan skema). Transaksi lama tidak ditulis ulang. */
const CASH_ON_HAND = 'Kas Tunai Workshop';
function cashSources(current) {
  const out = [];
  COMPANY.accounts.forEach(a => { const l = (a.src || a.bank || '').trim(); if (l && out.indexOf(l) < 0) out.push(l); });
  if (out.indexOf(CASH_ON_HAND) < 0) out.push(CASH_ON_HAND);
  if (current && out.indexOf(current) < 0) out.push(current);   /* label lama yang masih dipakai data */
  return out;
}

const STATUS = {
  prospect_follow_up: { label: 'Follow Up', tone: 'neutral' },
  prospect_nego: { label: 'Nego', tone: 'warn' },
  prospect_deal: { label: 'Deal', tone: 'accent' },
  pending_dp_verification: { label: 'Menunggu Verifikasi DP', tone: 'warn' },
  cl_design_draft: { label: 'Draft / Revisi CL & Desain', tone: 'accent' },
  in_production: { label: 'Dalam Produksi', tone: 'accent' },
  in_rework: { label: 'Perbaikan (Rework)', tone: 'bad' },

/* ---------- Image utilities (canvas) ---------- */
function compressImage(file, max, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('File bukan gambar yang valid'));
      img.onload = () => {
        let w = img.width, hgt = img.height;
        if (w > hgt && w > max) { hgt = Math.round(hgt * max / w); w = max; }
        else if (hgt >= w && hgt > max) { w = Math.round(w * max / hgt); hgt = max; }
        const c = document.createElement('canvas');
        c.width = w; c.height = hgt;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, hgt);
        ctx.drawImage(img, 0, 0, w, hgt);
        const url = c.toDataURL('image/jpeg', quality);
        resolve({ url, width: w, height: hgt, bytes: Math.round((url.length - 23) * 0.75) });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
/* Logo brand: tetap PNG supaya latar transparan tidak jadi hitam/putih */
function brandLogoFrom(file, max) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('File bukan gambar yang valid'));
      img.onload = () => {
        let w = img.width || max, hgt = img.height || max;
        const k = Math.min(1, max / Math.max(w, hgt));
        w = Math.max(1, Math.round(w * k)); hgt = Math.max(1, Math.round(hgt * k));
        const c = document.createElement('canvas'); c.width = w; c.height = hgt;
        c.getContext('2d').drawImage(img, 0, 0, w, hgt);
        resolve({ logo: c.toDataURL('image/png'), logoW: w, logoH: hgt });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
const kb = b => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');

function makeMockup(o) {

    x.strokeStyle = 'rgba(0,0,0,0.35)'; x.lineWidth = 3; x.stroke();
    x.strokeStyle = o.accent; x.lineWidth = 9;
    x.beginPath(); x.moveTo(ox - 70, oy + 40); x.quadraticCurveTo(ox, oy + (back ? 52 : 92), ox + 70, oy + 40); x.stroke();
    x.lineWidth = 12;

    x.fillStyle = o.accent; x.textAlign = 'center';

      x.font = '700 120px Arial'; x.fillText(o.number || '10', ox, oy + 380);

function makeArt(label, hue) {
  const c = document.createElement('canvas');
  c.width = 420; c.height = 300;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 420, 300);
  x.strokeStyle = '#d5dae4'; x.lineWidth = 2; x.strokeRect(6, 6, 408, 288);
  x.fillStyle = 'hsl(' + hue + ',70%,45%)'; x.beginPath(); x.arc(210, 120, 62, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#ffffff'; x.font = '700 44px Arial'; x.textAlign = 'center'; x.fillText('M', 210, 136);
  x.fillStyle = '#1b2230'; x.font = '700 22px Arial'; x.fillText(label, 210, 240);
  return c.toDataURL('image/jpeg', 0.8);
}
function makePhoto(label, tone) {
  const c = document.createElement('canvas');
  c.width = 480; c.height = 320;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 480, 320);
  g.addColorStop(0, 'hsl(' + tone + ',22%,34%)'); g.addColorStop(1, 'hsl(' + (tone + 30) + ',28%,20%)');
  x.fillStyle = g; x.fillRect(0, 0, 480, 320);
  x.strokeStyle = 'rgba(255,255,255,0.18)'; x.lineWidth = 2;
  for (let i = -320; i < 480; i += 26) { x.beginPath(); x.moveTo(i, 320); x.lineTo(i + 320, 0); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,0.92)'; x.font = '700 30px Arial'; x.textAlign = 'center';
  x.fillText('FOTO BUKTI KERJA', 240, 150);
  x.font = '600 24px Arial'; x.fillText(label, 240, 190);
  return c.toDataURL('image/jpeg', 0.6);
}

    if (!raw) return null;

    if (s && (s.v === 3 || s.v === 4) && Array.isArray(s.projects) && s.projects.length && Array.isArray(s.cash)) {
      if (s.v === 3) {
        /* Data lama: semua proyek dianggap milik Sales pertama. */

    }

}

}
function clearStore() { try { window.localStorage.removeItem(STORE_KEY); } catch (e) { /* abaikan */ } }

/* ---------- PDF renderer (jsPDF, multi-page, tidak memotong konten) ---------- */
function renderPDF(doc) {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw new Error('Mesin PDF belum termuat. Muat ulang halaman lalu coba lagi.');
  const pdf = new J({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const W = 210, H = 297, M = 14, CW = W - M * 2, BOTTOM = H - 16;
  let y = M;
  const ink = [24, 24, 27], gray = [113, 113, 122], line = [228, 228, 231], soft = [244, 244, 245];
  const tones = { ok: [4, 120, 87], warn: [180, 83, 9], neutral: [71, 85, 105], bad: [190, 18, 60] };
  const setC = c => pdf.setTextColor(c[0], c[1], c[2]);
  const font = (st, sz) => { pdf.setFont('helvetica', st); pdf.setFontSize(sz); };
  const mono = (st, sz) => { pdf.setFont('courier', st); pdf.setFontSize(sz); };
  const lines = (txt, w) => pdf.splitTextToSize(String(txt === undefined || txt === null ? '' : txt), w);
  const newPage = () => { pdf.addPage(); y = M + 4; };
  const ensure = hh => { if (y + hh > BOTTOM) newPage(); };

  const drawHead = b => {
    let tx = M;
    if (b.kop.logo && b.kop.logoW > 0) {
      try {
        const lh = Math.min(17, 30 * b.kop.logoH / b.kop.logoW), lw = lh * b.kop.logoW / b.kop.logoH;
        pdf.addImage(b.kop.logo, 'PNG', M, y, lw, lh); tx = M + lw + 3.5;
      } catch (e) { tx = M; }
    }
    font('bold', 15); setC(ink); pdf.text(b.kop.name, tx, y + 5.5);
    font('normal', 8.5); setC(gray);
    let ly = y + 10.5;
    if (b.kop.tagline) { pdf.text(b.kop.tagline, tx, ly); ly += 4.3; }
    if (b.kop.contact) { pdf.text(b.kop.contact, tx, ly); ly += 4.3; }
    let extra = 0;
    if (b.kop.address) {
      const al = lines(b.kop.address, 100 - (tx - M)).slice(0, 3);
      al.forEach((t, k) => pdf.text(t, tx, ly + k * 4)); extra = Math.max(0, ly + al.length * 4 - (y + 20));
    }
    font('normal', 7.5); setC(gray); pdf.text(b.title, W - M, y + 4.5, { align: 'right' });
    mono('bold', 11); setC(ink); pdf.text(b.number, W - M, y + 10, { align: 'right' });
    font('normal', 8.5); setC(gray); pdf.text(b.date, W - M, y + 14.5, { align: 'right' });
    const tc = tones[b.badge.tone] || tones.neutral;
    font('bold', 7); const bw = pdf.getTextWidth(b.badge.text) + 5;
    pdf.setDrawColor(tc[0], tc[1], tc[2]); pdf.setLineWidth(0.25);
    pdf.roundedRect(W - M - bw, y + 17.5, bw, 5.6, 1, 1, 'S');
    setC(tc); pdf.text(b.badge.text, W - M - bw / 2, y + 21.4, { align: 'center' });
    y += 27 + extra;
    pdf.setDrawColor(line[0], line[1], line[2]); pdf.setLineWidth(0.25); pdf.line(M, y, W - M, y);
    y += 7;
  };
  const drawKV = b => {
    const colW = CW / 2 - 3;
    for (let i = 0; i < b.rows.length; i += 2) {
      const pair = [b.rows[i], b.rows[i + 1]].filter(Boolean);
      font('bold', 9.5);
      const ls = pair.map(r => lines(r[1], colW));
      const rh = Math.max(...ls.map(l => l.length)) * 4.3 + 6.5;
      ensure(rh);
      pair.forEach((r, k) => {
        const x = M + k * (colW + 6);
        font('normal', 7.2); setC(gray); pdf.text(String(r[0]).toUpperCase(), x, y + 3);
        font('bold', 9.5); setC(ink); pdf.text(ls[k], x, y + 7.6);
      });
      y += rh;
    }
    y += 2;
  };
  const drawH = b => {
    ensure(16);
    font('bold', 7.5); setC(gray); pdf.text(b.text.toUpperCase(), M, y + 4);
    pdf.setDrawColor(line[0], line[1], line[2]); pdf.setLineWidth(0.25); pdf.line(M, y + 6, W - M, y + 6);
    y += 10;
  };
  const drawTable = b => {
    const tot = b.widths.reduce((s, w) => s + w, 0);
    const cw = b.widths.map(w => w / tot * CW);
    const xs = cw.reduce((a, w, i) => { a.push(i ? a[i - 1] + cw[i - 1] : M); return a; }, []);
    const pad = 1.8;
    const drawRow = (cells, isHead, minH) => {
      font(isHead ? 'bold' : 'normal', isHead ? 8.5 : 9);
      const ls = cells.map((c, i) => lines(c, cw[i] - pad * 2));
      const rh = Math.max(Math.max(...ls.map(l => l.length)) * 4.1 + 3.4, minH || 0);
      if (y + rh > BOTTOM) { newPage(); drawRow(b.head, true); font(isHead ? 'bold' : 'normal', isHead ? 8.5 : 9); }
      cells.forEach((c, i) => {
        const al = b.align[i];
        if (isHead) { font('bold', 7.5); setC(gray); } else if (al !== 'l') { mono('normal', 8.5); setC(ink); } else { font('normal', 9); setC(ink); }
        const tx = al === 'r' ? xs[i] + cw[i] - pad : al === 'c' ? xs[i] + cw[i] / 2 : xs[i] + pad;
        pdf.text(isHead ? ls[i].map(t => String(t).toUpperCase()) : ls[i], tx, y + 4.6, { align: al === 'r' ? 'right' : al === 'c' ? 'center' : 'left' });
      });
      pdf.setDrawColor(isHead ? 212 : line[0], isHead ? 212 : line[1], isHead ? 216 : line[2]); pdf.setLineWidth(isHead ? 0.3 : 0.2);
      pdf.line(M, y + rh, W - M, y + rh);

    };

    b.body.forEach(r => drawRow(r, false, b.minRow));
    y += 4;
  };
  const drawSplit = b => {
    font('normal', 9);
    const bl = [b.left.title].concat(b.left.lines);
    const boxH = bl.length * 4.8 + 5, sumH = b.right.length * 7.5 + 2;
    const hh = Math.max(boxH, sumH);
    ensure(hh + 4);
    pdf.setDrawColor(line[0], line[1], line[2]); pdf.setLineWidth(0.5);
    pdf.line(M, y, M, y + boxH - 1);
    bl.forEach((l, i) => { if (i === 0) { font('bold', 7.5); setC(gray); pdf.text(l.toUpperCase(), M + 4, y + 3.5); } else { font('normal', 9); setC(ink); pdf.text(l, M + 4, y + 3.5 + i * 4.8); } });
    const sx = W - M - 82;
    b.right.forEach((r, i) => {
      const yy = y + 4 + i * 7.5;
      if (r[2]) { pdf.setLineWidth(0.3); pdf.setDrawColor(ink[0], ink[1], ink[2]); pdf.line(sx, yy - 5, W - M, yy - 5); }
      font('normal', r[2] ? 9.5 : 9); setC(r[2] ? ink : gray); pdf.text(r[0], sx, yy);
      mono(r[2] ? 'bold' : 'normal', r[2] ? 11 : 9.5); setC(ink); pdf.text(r[1], W - M, yy, { align: 'right' });
    });
    y += hh + 5;
  };
  const drawImage = b => {
    let wpx = 1, hpx = 1, fmt = 'JPEG';
    try { const pr = pdf.getImageProperties(b.src); wpx = pr.width; hpx = pr.height; fmt = pr.fileType || 'JPEG'; } catch (e) { /* abaikan */ }
    let iw = CW - 6, ih = iw * hpx / wpx;
    if (ih > b.maxH) { ih = b.maxH; iw = ih * wpx / hpx; }
    ensure(ih + 14);
    pdf.setFillColor(250, 250, 250); pdf.setDrawColor(line[0], line[1], line[2]); pdf.setLineWidth(0.25);
    pdf.rect(M, y, CW, ih + 10, 'FD');
    pdf.addImage(b.src, fmt, M + (CW - iw) / 2, y + 2, iw, ih);
    font('normal', 7.5); setC(gray); pdf.text(b.caption || '', M + CW / 2, y + ih + 7, { align: 'center' });
    y += ih + 14;
  };
  const drawText = b => {
    font('normal', 9.5);
    const ls = lines(b.body, CW - (b.label ? 0 : 0));
    ensure(ls.length * 4.4 + 9);
    if (b.label) { font('bold', 7.5); setC(gray); pdf.text(b.label.toUpperCase(), M, y + 3.5); y += 5.5; }
    font('normal', 9.5); setC(ink); pdf.text(ls, M, y + 3.5);
    y += ls.length * 4.4 + 4;
  };
  const drawSizes = b => {
    const n = b.sizes.length + 1, bw = CW / n;
    ensure(26);
    b.sizes.concat([{ label: 'TOTAL', qty: b.total, tot: true }]).forEach((s, i) => {
      const x = M + i * bw;
      if (s.tot) { pdf.setFillColor(soft[0], soft[1], soft[2]); pdf.rect(x, y, bw, 20, 'F'); }
      pdf.setDrawColor(line[0], line[1], line[2]); pdf.setLineWidth(0.25); pdf.rect(x, y, bw, 20, 'S');
      font('bold', 7.5); setC(gray); pdf.text(s.label, x + bw / 2, y + 6, { align: 'center' });
      mono('bold', 16); setC(ink); pdf.text(String(s.qty), x + bw / 2, y + 15, { align: 'center' });
    });
    y += 26;
  };
  const drawSpecImages = b => {
    const gap = 4, n = 3, cw = (CW - gap * (n - 1)) / n, boxH = 46;
    for (let i = 0; i < b.items.length; i += n) {
      ensure(boxH + 12);
      b.items.slice(i, i + n).forEach((it, k) => {
        const x0 = M + k * (cw + gap);
        font('bold', 7.5); setC(gray); pdf.text(it.label.toUpperCase(), x0, y + 3.5);
        pdf.setDrawColor(line[0], line[1], line[2]); pdf.setFillColor(250, 250, 250); pdf.setLineWidth(0.25);
        pdf.rect(x0, y + 5, cw, boxH, 'FD');
        let wpx = 1, hpx = 1, fmt = 'JPEG';
        try { const pr = pdf.getImageProperties(it.src); wpx = pr.width; hpx = pr.height; fmt = pr.fileType || 'JPEG'; } catch (e) { /* abaikan */ }
        let iw = cw - 4, ih = iw * hpx / wpx;
        if (ih > boxH - 4) { ih = boxH - 4; iw = ih * wpx / hpx; }
        pdf.addImage(it.src, fmt, x0 + (cw - iw) / 2, y + 5 + (boxH - ih) / 2, iw, ih);
      });
      y += boxH + 10;
    }
    y += 2;
  };
  const drawSign = b => {
    ensure(46);
    const cwid = CW / 2 - 6;
    b.cols.forEach((c, i) => {
      const x = M + i * (cwid + 12);
      font('normal', 9); setC(gray); pdf.text(c.title, x + cwid / 2, y + 4, { align: 'center' });
      pdf.setDrawColor(161, 161, 170); pdf.setLineWidth(0.25); pdf.line(x + 6, y + 30, x + cwid - 6, y + 30);
      font('bold', 9.5); setC(ink); pdf.text(c.name, x + cwid / 2, y + 35, { align: 'center' });
      font('normal', 8); setC(gray); pdf.text('Tanda tangan & tanggal', x + cwid / 2, y + 39.5, { align: 'center' });
    });
    y += 44;
  };

  doc.blocks.forEach(b => {
    if (b.t === 'head') drawHead(b);
    else if (b.t === 'kv') drawKV(b);
    else if (b.t === 'h') drawH(b);
    else if (b.t === 'table') drawTable(b);
    else if (b.t === 'split') drawSplit(b);
    else if (b.t === 'image') drawImage(b);
    else if (b.t === 'text') drawText(b);
    else if (b.t === 'sizegrid') drawSizes(b);
    else if (b.t === 'specimages') drawSpecImages(b);
    else if (b.t === 'sign') drawSign(b);
  });
  const pages = pdf.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    pdf.setPage(i);
    pdf.setDrawColor(line[0], line[1], line[2]); pdf.setLineWidth(0.2); pdf.line(M, H - 12, W - M, H - 12);
    font('normal', 7.5); setC(gray);
    pdf.text(COMPANY.name.toUpperCase() + ' · ' + doc.title + ' ' + doc.number, M, H - 8);
    pdf.text('Halaman ' + i + ' dari ' + pages, W - M, H - 8, { align: 'right' });
  }
  return pdf;
}

async function downloadPDF(doc) {
  const pdf = renderPDF(doc);
  const blob = pdf.output('blob');
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (dl) return dl.save({ filename: doc.filename, data: blob });
  /* Cadangan saat dibuka di luar penampil Claude: unduhan browser biasa */
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = doc.filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return { status: 'saved' };
}
/* ---------- Laporan keuangan: periode, piutang, ekspor Excel (.xlsx tanpa pustaka luar) ---------- */
const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const ALL_PERIOD = { year: 'all', month: 'all' };

const dparts = iso => { const d = new Date(iso); return isNaN(d.getTime()) ? null : { y: d.getFullYear(), m: d.getMonth(), t: d.getTime() }; };
function inPeriod(iso, per) {
  const d = dparts(iso);
  if (!d) return false;
  if (per.year !== 'all' && d.y !== Number(per.year)) return false;
  if (per.month !== 'all' && d.m !== Number(per.month)) return false;
  return true;
}
/* Awal periode (ms). null = tidak ada batas awal. */
function periodStart(per) {
  if (per.year === 'all') return null;
  return new Date(Number(per.year), per.month === 'all' ? 0 : Number(per.month), 1).getTime();
}
function periodLabel(per) {
  if (per.year === 'all') return 'Semua periode';
  return per.month === 'all' ? 'Tahun ' + per.year : MONTHS[Number(per.month)] + ' ' + per.year;
}
function periodSlug(per) {
  if (per.year === 'all') return 'semua-periode';
  return per.month === 'all' ? String(per.year) : per.year + '-' + String(Number(per.month) + 1).padStart(2, '0');
}
function periodYears(projects, cash) {
  const set = new Set([new Date().getFullYear()]);
  cash.forEach(t => { const d = dparts(t.date); if (d) set.add(d.y); });
  projects.forEach(p => { if (p.invoice) { const d = dparts(p.invoice.date); if (d) set.add(d.y); } });
  return Array.from(set).sort((a, b) => b - a);
}

/* Rincian piutang per invoice: dari mana datangnya dan kenapa belum lunas. */
const PIU_GROUPS = [
  ['dp', 'DP belum diverifikasi Finance'],
  ['tagih', 'Barang jadi, menunggu pembayaran klien'],
  ['verif', 'Pelunasan diajukan, menunggu verifikasi Finance'],
  ['proses', 'Pesanan masih diproses (belum jatuh tempo)']
];
function piutangRows(projects, per, now) {
  const t0 = now || Date.now();
  const out = [];
  projects.forEach(p => {
    const i = p.invoice;
    if (!i || !inPeriod(i.date, per)) return;
    const paid = paidOf(p), sisa = Math.max(0, i.total - paid);
    if (sisa <= 0) return;
    const dpOut = i.dpStatus === 'verified' ? 0 : Math.min(sisa, i.dpNominal);
    const setOut = sisa - dpOut;
    let setGroup = 'proses', setNote = 'Belum jatuh tempo · pesanan: ' + ((STATUS[p.status] && STATUS[p.status].label) || p.status);
    if (p.status === 'completed_pending_settlement') {
      setGroup = 'tagih'; setNote = 'Barang jadi · menunggu pembayaran klien' + (i.settleReject ? ' (dikembalikan Finance: ' + i.settleReject + ')' : '');
    } else if (p.status === 'pending_settlement_verification') {
      setGroup = 'verif'; setNote = 'Pelunasan sudah diajukan Sales · menunggu verifikasi Finance';
    }
    const lines = [];
    if (dpOut > 0) lines.push({ g: 'dp', label: 'DP', amount: dpOut, note: 'Belum diverifikasi Finance' });
    if (setOut > 0) lines.push({ g: setGroup, label: 'Pelunasan', amount: setOut, note: setNote });
    out.push({
      p, no: i.no, date: i.date, umur: Math.max(0, Math.floor((t0 - new Date(i.date).getTime()) / 864e5)),
      client: p.client.name, name: p.name, total: i.total, dpNominal: i.dpNominal, paid, sisa, dpOut, setOut, lines
    });
  });
  return out.sort((a, b) => new Date(a.date) - new Date(b.date));
}
function piutangGroups(rows) {
  const sum = {};
  PIU_GROUPS.forEach(g => { sum[g[0]] = 0; });
  rows.forEach(r => r.lines.forEach(l => { sum[l.g] += l.amount; }));
  return PIU_GROUPS.map(g => ({ key: g[0], label: g[1], amount: sum[g[0]] }));
}

/* Ringkasan keuangan untuk satu periode. */
function financeP(projects, cash, per) {
  const rows = cash.filter(t => inPeriod(t.date, per));
  const start = periodStart(per);
  const sign = t => (t.type === 'in' ? t.amount : -t.amount);
  const opening = start === null ? 0 : cash.reduce((s, t) => { const d = dparts(t.date); return d && d.t < start ? s + sign(t) : s; }, 0);
  const inn = rows.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const out = rows.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  const invs = projects.filter(p => p.invoice && inPeriod(p.invoice.date, per));
  const piu = piutangRows(projects, per);
  return { rows, opening, inn, out, closing: opening + inn - out, omzet: invs.reduce((s, p) => s + p.invoice.total, 0), invCount: invs.length, piu, piuTotal: piu.reduce((s, r) => s + r.sisa, 0), groups: piutangGroups(piu) };
}

    const local = new Uint8Array([0x50, 0x4B, 0x03, 0x04].concat(common));
    chunks.push(local, name, data);
    central.push({ name, common, crc, offset });
    offset += local.length + name.length + data.length;
  });
  const cdStart = offset;
  central.forEach(c => {
    const head = new Uint8Array([0x50, 0x4B, 0x01, 0x02].concat(u16(20), c.common, u16(0), u16(0), u16(0), u32(0), u32(c.offset)));
    chunks.push(head, c.name);
    offset += head.length + c.name.length;

  const end = new Uint8Array([0x50, 0x4B, 0x05, 0x06].concat(u16(0), u16(0), u16(central.length), u16(central.length), u32(offset - cdStart), u32(cdStart), u16(0)));
  chunks.push(end);
  return new Blob(chunks, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xe = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Susun isi buku kerja: Ringkasan, Buku Kas, Piutang. */
function buildWorkbook(projects, cash, per) {
  const f = financeP(projects, cash, per);
  const H = (...a) => a.map(v => ({ v, s: 'head' }));
  const B = v => ({ v, s: 'bold' });
  const N = v => ({ v, s: 'num' });
  const ring = [
    [{ v: COMPANY.name + ' · Laporan Keuangan', s: 'title' }],
    [{ v: 'Periode: ' + periodLabel(per), s: 'bold' }],
    [{ v: 'Dibuat: ' + new Date().toLocaleString('id-ID'), s: 'muted' }],
    [],
    [B('Buku Kas'), ''],
    ['Saldo awal periode', N(f.opening)],
    ['Kas masuk', N(f.inn)],
    ['Kas keluar', N(f.out)],
    [B('Saldo akhir periode'), { v: f.closing, s: 'boldnum' }],
    [],
    [B('Kontrak & Piutang (berdasarkan tanggal invoice terbit)')],
    ['Jumlah invoice terbit', N(f.invCount)],
    ['Omzet kontrak', N(f.omzet)]
  ];
  f.groups.forEach(g => ring.push(['Piutang · ' + g.label, N(g.amount)]));
  ring.push([B('Total piutang belum lunas'), { v: f.piuTotal, s: 'boldnum' }]);

  const kas = [H('No', 'Tanggal', 'Keterangan', 'Kategori', 'Klien', 'Akun', 'Masuk (Rp)', 'Keluar (Rp)', 'Saldo (Rp)')];
  let bal = f.opening, n = 0;
  if (per.year !== 'all') kas.push(['', '', B('Saldo awal periode'), '', '', '', '', '', N(f.opening)]);
  f.rows.slice().sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(t => {
    bal += t.type === 'in' ? t.amount : -t.amount; n++;
    kas.push([N(n), { d: t.date }, t.note, CASH_CATS[t.category] || t.category, t.client && t.client !== '-' ? t.client : '', t.account || '', t.type === 'in' ? N(t.amount) : '', t.type === 'out' ? N(t.amount) : '', N(bal)]);
  });
  const last = kas.length;
  kas.push(['', '', B('TOTAL'), '', '', '', { v: f.inn, s: 'boldnum' }, { v: f.out, s: 'boldnum' }, { v: bal, s: 'boldnum' }]);

  const piu = [H('No', 'No. Invoice', 'Tgl Invoice', 'Klien', 'Pesanan', 'Umur (hari)', 'Total Invoice', 'Nominal DP', 'Sudah Dibayar', 'Piutang DP', 'Piutang Pelunasan', 'Total Piutang', 'Posisi / Alasan', 'Sales')];
  f.piu.forEach((r, i) => piu.push([N(i + 1), r.no, { d: r.date }, r.client, r.name, N(r.umur), N(r.total), N(r.dpNominal), N(r.paid), N(r.dpOut), N(r.setOut), N(r.sisa),
    { v: r.lines.map(l => l.label + ' ' + rp(l.amount) + ': ' + l.note).join('\n'), s: 'wrap' }, salesText(r.p)]));
  piu.push(['', '', '', B('TOTAL'), '', '', { v: f.piu.reduce((s, r) => s + r.total, 0), s: 'boldnum' }, { v: f.piu.reduce((s, r) => s + r.dpNominal, 0), s: 'boldnum' }, { v: f.piu.reduce((s, r) => s + r.paid, 0), s: 'boldnum' },
    { v: f.piu.reduce((s, r) => s + r.dpOut, 0), s: 'boldnum' }, { v: f.piu.reduce((s, r) => s + r.setOut, 0), s: 'boldnum' }, { v: f.piuTotal, s: 'boldnum' }, '', '']);

  return [
    { name: 'Ringkasan', cols: [52, 20], rows: ring },
    { name: 'Buku Kas', cols: [6, 12, 42, 22, 26, 20, 16, 16, 16], rows: kas, freeze: 1, filter: { row: 1, last } },
    { name: 'Piutang', cols: [6, 18, 12, 26, 30, 11, 16, 16, 16, 16, 18, 16, 64, 22], rows: piu, freeze: 1 }
  ];
}

async function downloadXLSX(projects, cash, per) {
  const blob = makeXlsx(buildWorkbook(projects, cash, per));
  const filename = brandSlug() + '_Buku-Kas_' + periodSlug(per) + '.xlsx';
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (dl) { await dl.save({ filename, data: blob }); return filename; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return filename;
}

const rowToUser = r => ({ id: r.id, name: r.name || (r.email || '').split('@')[0], email: r.email || '', role: r.role, salesCode: r.sales_code || null, active: r.active !== false, createdAt: r.created_at });
const rowToCash = r => ({ id: r.id, type: r.type, category: r.category, amount: Number(r.amount), client: r.client || '-', note: r.note || '', date: r.date, account: r.account || '' });
const cashToRow = t => ({ id: t.id, type: t.type, category: t.category, amount: t.amount, client: t.client || '-', note: t.note || '', account: t.account || '', date: t.date });
const projToRow = p => ({ id: p.id, code: p.code, sales_id: p.salesId, status: p.status, data: p });
const CASH_ROLES = ['owner', 'admin_keuangan'];

/* Penyimpan data cloud untuk satu pengguna yang sedang masuk.
   cb: { projects(updater), cash(updater), status(s), toast(text, tone), latest() -> {projects, cash} } */
function createCloudStore(client, user, cb) {
  const known = new Map();      /* id proyek -> { ref, rev } (ref = objek yang terakhir sinkron) */
  const knownCash = new Set();
  const inflight = new Set(), deferred = new Set();
  let timer = null, retry = null, saving = false, again = false, dead = false, channel = null, ready = false;
  const canCash = CASH_ROLES.includes(user.role);
  const stopFns = [];

  const setStatus = (state, msg) => { if (!dead) cb.status({ state, msg: msg || '' }); };
  const byNewest = (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0);

  async function fetchAll() {
    const pr = await client.from('projects').select('id,rev,data');
    if (pr.error) throw pr.error;
    let cashRows = [];
    if (canCash) {
      const cs = await client.from('cash').select('*').order('date', { ascending: false });
      if (cs.error) throw cs.error;
      cashRows = cs.data || [];
    }
    return { projectRows: pr.data || [], cashRows };
  }

  async function load() {
    const { projectRows, cashRows } = await fetchAll();
    const projects = projectRows.map(r => { const p = r.data; known.set(p.id, { ref: p, rev: r.rev }); return p; }).sort(byNewest);
    const cash = cashRows.map(rowToCash);
    cash.forEach(t => knownCash.add(t.id));
    ready = true;
    return { projects, cash };
  }

  /* Ambil ulang dari server: terapkan yang lebih baru, kecuali ada perubahan lokal yang belum tersimpan. */
  async function refresh(quiet) {
    if (dead || !ready) return;
    try {
      const { projectRows, cashRows } = await fetchAll();
      const local = cb.latest();
      const localRef = new Map(local.projects.map(p => [p.id, p]));
      const incoming = [];
      projectRows.forEach(r => {
        const k = known.get(r.id);
        if (k && r.rev <= k.rev) return;
        const dirty = k && localRef.get(r.id) !== k.ref;
        known.set(r.id, { ref: r.data, rev: r.rev });
        incoming.push({ p: r.data, dirty });
      });
      if (incoming.length) {
        cb.projects(ps => {
          let next = ps.slice();
          incoming.forEach(({ p }) => { const i = next.findIndex(x => x.id === p.id); if (i >= 0) next[i] = p; else next.push(p); });
          return next.sort(byNewest);
        });
        if (!quiet) cb.toast(incoming.length + ' data diperbarui dari perangkat / pengguna lain.', 'warn');
      }
      const newCash = cashRows.filter(r => !knownCash.has(r.id)).map(rowToCash);
      if (newCash.length) { newCash.forEach(t => knownCash.add(t.id)); cb.cash(cs => newCash.concat(cs).sort((a, b) => new Date(b.date) - new Date(a.date))); }
    } catch (e) { /* biarkan; status simpan menampilkan masalah koneksi */ }
  }

  async function replaceOne(id) {
    const { data, error } = await client.from('projects').select('id,rev,data').eq('id', id).maybeSingle();
    if (error || !data) return;
    known.set(id, { ref: data.data, rev: data.rev });
    cb.projects(ps => ps.map(x => (x.id === id ? data.data : x)));
  }

  async function flush() {
    if (dead || !ready) return;
    if (saving) { again = true; return; }
    saving = true; again = false;
    let failed = false, message = '';
    try {
      const { projects, cash } = cb.latest();
      const ups = projects.filter(p => { const k = known.get(p.id); return !k || k.ref !== p; });
      const newCash = canCash ? cash.filter(t => !knownCash.has(t.id)) : [];
      if (!ups.length && !newCash.length) { saving = false; setStatus('ok'); return; }
      setStatus('saving');
      ups.forEach(p => inflight.add(p.id));
      for (const p of ups) {
        const k = known.get(p.id);
        if (!k) {
          const r = await client.from('projects').insert(projToRow(p)).select('id,rev');
          if (r.error) {
            if (r.error.code === '23505') { cb.toast('Nomor proyek ' + p.code + ' sudah dipakai. Muat ulang halaman lalu buat ulang prospeknya.', 'bad'); message = 'Nomor proyek bentrok'; failed = true; continue; }
            throw r.error;
          }
          known.set(p.id, { ref: p, rev: (r.data && r.data[0] && r.data[0].rev) || 1 });
        } else {
          const r = await client.from('projects').update(projToRow(p)).eq('id', p.id).eq('rev', k.rev).select('id,rev');
          if (r.error) throw r.error;
          if (!r.data || !r.data.length) {
            await replaceOne(p.id);
            cb.toast('Proyek "' + p.name + '" baru saja diubah pengguna lain. Data terbaru dimuat; ulangi aksi Anda bila perlu.', 'bad');
            continue;
          }
          known.set(p.id, { ref: p, rev: r.data[0].rev });
        }
      }
      if (newCash.length) {
        const r = await client.from('cash').insert(newCash.map(cashToRow));
        if (r.error && r.error.code !== '23505') throw r.error;
        newCash.forEach(t => knownCash.add(t.id));
      }
    } catch (e) {
      failed = true; message = (e && e.message) || 'Gagal menyimpan';
      if (!dead) { clearTimeout(retry); retry = setTimeout(() => { retry = null; flush(); }, 15000); }
    }
    saving = false;
    const late = Array.from(deferred);
    inflight.clear(); deferred.clear();
    late.forEach(id => syncOne(id));
    if (again && !failed) { flush(); return; }
    setStatus(failed ? 'error' : 'ok', message);
  }

  function pendingCash() { const l = cb.latest(); return canCash ? l.cash.filter(t => !knownCash.has(t.id)).length : 0; }
  function pendingProjects() { const l = cb.latest(); return l.projects.filter(p => { const k = known.get(p.id); return !k || k.ref !== p; }).length; }
  function push() {
    if (dead || !ready) return;
    if (pendingProjects() + pendingCash() === 0) return;
    setStatus('saving');
    clearTimeout(timer);
    timer = setTimeout(flush, 400);
  }

  /* Ambil satu proyek dari server dan terapkan bila lebih baru dari yang kita ketahui. */
  async function syncOne(id) {
    if (dead) return;
    const { data, error } = await client.from('projects').select('id,rev,data').eq('id', id).maybeSingle();
    if (error || !data) return;
    const k = known.get(data.id);
    if (k && data.rev <= k.rev) return;
    const dirty = k && cb.latest().projects.find(x => x.id === data.id) !== k.ref;
    known.set(data.id, { ref: data.data, rev: data.rev });
    cb.projects(ps => (ps.some(x => x.id === data.id) ? ps.map(x => (x.id === data.id ? data.data : x)) : [data.data].concat(ps)).sort(byNewest));
    if (dirty) cb.toast('"' + data.data.name + '" diperbarui pengguna lain; perubahan Anda yang belum tersimpan tertimpa.', 'warn');
  }
  function onProjectEvent(payload) {
    if (dead) return;
    if (payload.eventType === 'DELETE') {
      const id = payload.old && payload.old.id;
      if (id) { known.delete(id); cb.projects(ps => ps.filter(p => p.id !== id)); }
      return;
    }
    const row = payload.new || {};
    if (!row.id) return;
    if (inflight.has(row.id)) { deferred.add(row.id); return; }   /* gema tulisan kita sendiri: diperiksa setelah simpan selesai */
    const k = known.get(row.id);
    if (k && typeof row.rev === 'number' && row.rev <= k.rev) return;
    syncOne(row.id);
  }
  function onCashEvent(payload) {
    if (dead || !payload.new) return;
    const t = rowToCash(payload.new);
    if (knownCash.has(t.id)) return;
    knownCash.add(t.id);
    cb.cash(cs => [t].concat(cs));
  }

  function subscribe() {
    if (dead) return;
    channel = client.channel('SISO-live-' + user.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, onProjectEvent);
    if (canCash) channel = channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'cash' }, onCashEvent);
    channel.subscribe(st => { if (!dead && st === 'SUBSCRIBED') refresh(true); });
    const wake = () => { if (document.visibilityState !== 'hidden') refresh(true); };
    document.addEventListener('visibilitychange', wake);
    window.addEventListener('online', wake);
    window.addEventListener('online', flush);
    stopFns.push(() => { document.removeEventListener('visibilitychange', wake); window.removeEventListener('online', wake); window.removeEventListener('online', flush); });
  }
  function stop() {
    dead = true; clearTimeout(timer); clearTimeout(retry);
    stopFns.forEach(f => f());
    try { if (channel) client.removeChannel(channel); } catch (e) { /* abaikan */ }
  }
  return { load, push, flush, refresh, subscribe, stop, pendingCount: () => pendingProjects() + pendingCash() };
}

/* ---------- Finance helpers ---------- */
function finance(projects, cash) {
  const inn = cash.filter(t => t.type === 'in').reduce((s, t) => s + t.amount, 0);
  const out = cash.filter(t => t.type === 'out').reduce((s, t) => s + t.amount, 0);
  const withInv = projects.filter(p => p.invoice);
  return {
    inn, out, kas: inn - out,
    omzet: withInv.reduce((s, p) => s + p.invoice.total, 0),
    piutang: withInv.reduce((s, p) => s + (p.invoice.total - paidOf(p)), 0),
    dpQueue: projects.filter(p => p.invoice && p.invoice.dpStatus === 'unverified'),
    settleQueue: projects.filter(p => p.status === 'pending_settlement_verification'),
    settleWaiting: projects.filter(p => p.status === 'completed_pending_settlement')
  };
}

function CashList({ cash, limit, filter }) {

function Dashboard({ c }) {

  const isAll = c.period.year === 'all';
